<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fff; stroke: #222; stroke-width: 2; }
    .soft { fill: #f2f2f2; stroke: #222; stroke-width: 2; }
    .label { font-family: Caladea, serif; font-size: 22px; font-weight: 700; fill: #111; }
    .sub { font-family: Caladea, serif; font-size: 16px; fill: #333; }
    .edge { fill: none; stroke: #222; stroke-width: 2.2; marker-end: url(#arrow); }
    .edge-label { font-family: Caladea, serif; font-size: 15px; fill: #333; }
  </style>
  <rect x="55" y="55" width="230" height="100" rx="8" class="box"/>
  <text x="170" y="96" text-anchor="middle" class="label">Model</text>
  <text x="170" y="124" text-anchor="middle" class="sub">inference</text>
  <rect x="615" y="55" width="230" height="100" rx="8" class="box"/>
  <text x="730" y="96" text-anchor="middle" class="label">Akce</text>
  <text x="730" y="124" text-anchor="middle" class="sub">požadavek modelu</text>
  <rect x="615" y="265" width="230" height="100" rx="8" class="soft"/>
  <text x="730" y="305" text-anchor="middle" class="label">Nástroj / prostředí</text>
  <text x="730" y="333" text-anchor="middle" class="sub">provedení mimo model</text>
  <rect x="55" y="265" width="230" height="100" rx="8" class="box"/>
  <text x="170" y="305" text-anchor="middle" class="label">Pozorování</text>
  <text x="170" y="333" text-anchor="middle" class="sub">skutečný výsledek akce</text>
  <path d="M 285 105 L 615 105" class="edge"/>
  <path d="M 730 155 L 730 265" class="edge"/>
  <path d="M 615 315 L 285 315" class="edge"/>
  <path d="M 170 265 L 170 155" class="edge"/>
  <rect x="355" y="175" width="190" height="70" rx="8" class="soft"/>
  <text x="450" y="206" text-anchor="middle" class="label">Výsledek</text>
  <text x="450" y="230" text-anchor="middle" class="sub">volitelné ukončení</text>
  <path d="M 240 155 C 280 195, 315 210, 355 210" class="edge"/>
  <text x="300" y="186" text-anchor="middle" class="edge-label">hotovo</text>
</svg>
