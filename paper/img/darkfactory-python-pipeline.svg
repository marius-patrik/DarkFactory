<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Řídicí workflow Pythonové pipeline DarkFactory</title>
  <desc id="desc">Nový požadavek na GitHubu vede k interpretaci a plánu, které potvrzuje člověk. Po druhém schválení pipeline vytvoří větev, provede implementaci, ověření a otevře návrhový pull request. Následuje opakované sebehodnocení a opravy, kontrola souladu s plánem a lidská revize. Vyčerpání kvóty ukládá checkpoint, z něhož může příkaz resume navázat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#475569"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L10 5 L0 9z" fill="#b45309"/></marker>
    <style>
      .section { font-family: 'Carlito', 'Caladea', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .7px; fill: #475569; }
      .head { font-family: 'Carlito', 'Caladea', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text { font-family: 'Carlito', 'Caladea', Arial, sans-serif; font-size: 11.5px; fill: #334155; }
      .small { font-family: 'Carlito', 'Caladea', Arial, sans-serif; font-size: 10px; fill: #64748b; }
      .code { font-family: 'Courier New', monospace; font-size: 10px; font-weight: 700; fill: #1d4ed8; }
      .gate { font-family: 'Carlito', 'Caladea', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .5px; fill: #92400e; }
    </style>
  </defs>
  <rect x="10" y="10" width="980" height="600" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="39" class="section">ŘÍDICÍ WORKFLOW PYTHONOVÉ PIPELINE</text>
  <text x="35" y="60" class="small">Každý automatizovaný krok je spuštěn událostí GitHubu v kontejneru s runnerem <tspan class="code">agent_runner.py</tspan>.</text>
  <rect x="28" y="78" width="944" height="182" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="99" class="section">1. VYMEZENÍ ÚLOHY A SCHVÁLENÍ</text>
  <path d="M183 172 H210 M353 172 H380" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M523 172 H550" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M353 172 H380 M693 172 H720" fill="none" stroke="#b45309" stroke-width="1.7" marker-end="url(#arrow-amber)"/>
  <g><rect x="42" y="120" width="141" height="105" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/><text x="112" y="150" class="head" text-anchor="middle">Požadavek</text><text x="112" y="174" class="text" text-anchor="middle">nové issue</text><text x="112" y="199" class="small" text-anchor="middle">událost GitHubu</text></g>
  <g><rect x="210" y="120" width="143" height="105" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/><text x="281" y="150" class="head" text-anchor="middle">Interpretace</text><text x="281" y="174" class="text" text-anchor="middle">agent vloží komentář</text><text x="281" y="199" class="small" text-anchor="middle">rozsah a ověření</text></g>
  <g><rect x="380" y="120" width="143" height="105" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="451" y="146" class="gate" text-anchor="middle">LIDSKÁ BRÁNA 1</text><text x="451" y="171" class="head" text-anchor="middle">Schválení</text><text x="451" y="199" class="small" text-anchor="middle">interpretace</text></g>
  <g><rect x="550" y="120" width="143" height="105" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.3"/><text x="621" y="150" class="head" text-anchor="middle">Plán</text><text x="621" y="174" class="text" text-anchor="middle">agent vloží plán</text><text x="621" y="199" class="small" text-anchor="middle">rozsah a kroky</text></g>
  <g><rect x="720" y="120" width="143" height="105" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="792" y="146" class="gate" text-anchor="middle">LIDSKÁ BRÁNA 2</text><text x="792" y="171" class="head" text-anchor="middle">Schválení</text><text x="792" y="199" class="small" text-anchor="middle">plánu</text></g>
  <path d="M792 225 V292 H112 V315" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="28" y="285" width="944" height="238" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="306" class="section">2. IMPLEMENTACE, KONTROLA A PŘEDÁNÍ K REVIZI</text>
  <path d="M183 385 H210 M353 385 H380 M523 385 H550 M693 385 H720" fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <g><rect x="42" y="333" width="141" height="105" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.3"/><text x="112" y="362" class="head" text-anchor="middle">Pracovní větev</text><text x="112" y="386" class="text" text-anchor="middle">vytvoření a checkout</text><text x="112" y="411" class="small" text-anchor="middle">z výchozí větve</text></g>
  <g><rect x="210" y="333" width="143" height="105" rx="7" fill="#eef2ff" stroke="#818cf8" stroke-width="1.3"/><text x="281" y="362" class="head" text-anchor="middle">Implementace</text><text x="281" y="386" class="text" text-anchor="middle">harness upraví kód</text><text x="281" y="411" class="small" text-anchor="middle">podle plánu</text></g>
  <g><rect x="380" y="333" width="143" height="105" rx="7" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.3"/><text x="451" y="362" class="head" text-anchor="middle">Ověření</text><text x="451" y="386" class="text" text-anchor="middle">formátování a testy</text><text x="451" y="411" class="small" text-anchor="middle">selhání → jedna oprava</text></g>
  <g><rect x="550" y="333" width="143" height="105" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.3"/><text x="621" y="362" class="head" text-anchor="middle">Návrhový PR</text><text x="621" y="386" class="text" text-anchor="middle">commit, push, PR</text><text x="621" y="411" class="small" text-anchor="middle">spuštění seberevize</text></g>
  <g><rect x="720" y="333" width="143" height="105" rx="7" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.3"/><text x="792" y="360" class="head" text-anchor="middle">Seberevize a</text><text x="792" y="378" class="head" text-anchor="middle">soulad s plánem</text><text x="792" y="402" class="text" text-anchor="middle">nálezy → oprava → opakování</text><text x="792" y="421" class="small" text-anchor="middle">bez nálezů → PR připraven</text></g>
  <path d="M792 438 V465 H621 V445" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text x="707" y="459" class="small" text-anchor="middle">nález nebo změna mimo rozsah</text>
  <path d="M863 385 H909" fill="none" stroke="#b45309" stroke-width="1.7" marker-end="url(#arrow-amber)"/>
  <text x="932" y="369" class="gate" text-anchor="middle">LIDSKÁ</text><text x="932" y="384" class="gate" text-anchor="middle">REVIZE</text><text x="932" y="404" class="small" text-anchor="middle">přijetí</text><text x="932" y="419" class="small" text-anchor="middle">integrace</text>
  <rect x="128" y="548" width="744" height="43" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="151" y="574" class="head">Přerušení při vyčerpání kvóty</text><text x="421" y="574" class="text">→ uložení checkpointu, označení běhu jako blokovaného a navázání příkazem</text><text x="832" y="574" class="code">/resume</text>
</svg>
