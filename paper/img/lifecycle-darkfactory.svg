<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .node-title { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-weight: bold; font-size: 13px; }
    .node-sub { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 11px; }
    .badge-text { font-family: 'Courier New', monospace; font-size: 10px; font-weight: bold; }
    .phase-hdr { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
    .gate-lbl { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: bold; fill: #b45309; }
  </style>

  <!-- Canvas background -->
  <rect x="10" y="10" width="900" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- SECTION 1: SPECIFIKACE & PLÁNOVÁNÍ (Row 1) -->
  <rect x="25" y="24" width="870" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="44" class="phase-hdr" fill="#475569">FÁZE 1: ZADÁNÍ, INTERPRETACE A SCHVÁLENÍ PLÁNU</text>

  <!-- 1. Založení požadavku -->
  <g filter="url(#shadow)">
    <rect x="40" y="60" width="145" height="140" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" />
    <rect x="40" y="60" width="145" height="26" rx="8" fill="#f1f5f9" />
    <text x="112.5" y="78" text-anchor="middle" class="badge-text" fill="#475569">Issue: Request</text>
    <text x="112.5" y="106" text-anchor="middle" class="node-title" fill="#0f172a">1. Zadání úkolu</text>
    <text x="112.5" y="128" text-anchor="middle" class="node-sub" fill="#64748b">Uživatel zadá issue</text>
    <text x="112.5" y="146" text-anchor="middle" class="node-sub" fill="#0f172a" font-weight="bold">s doslovným zněním</text>
    <text x="112.5" y="166" text-anchor="middle" class="node-sub" fill="#64748b">bez zkreslení</text>
    <text x="112.5" y="186" text-anchor="middle" class="badge-text" fill="#64748b">stav: new</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 185 130 L 210 130" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />

  <!-- 2. Interpretace požadavku -->
  <g filter="url(#shadow)">
    <rect x="215" y="60" width="145" height="140" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" />
    <rect x="215" y="60" width="145" height="26" rx="8" fill="#eff6ff" />
    <text x="287.5" y="78" text-anchor="middle" class="badge-text" fill="#1d4ed8">stav: interpreted</text>
    <text x="287.5" y="106" text-anchor="middle" class="node-title" fill="#1e3a8a">2. Interpretace</text>
    <text x="287.5" y="128" text-anchor="middle" class="node-sub" fill="#475569">Agent analyzuje</text>
    <text x="287.5" y="146" text-anchor="middle" class="node-sub" fill="#475569">rozsah požadavku</text>
    <text x="287.5" y="166" text-anchor="middle" class="node-sub" fill="#475569">a popíše porozumění</text>
    <text x="287.5" y="186" text-anchor="middle" class="node-sub" fill="#2563eb">• čeká na gate 1</text>
  </g>

  <!-- Arrow 2 -> Gate 1 -->
  <path d="M 360 130 L 385 130" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)" />

  <!-- 3. Human Gate 1 -->
  <g filter="url(#shadow)">
    <rect x="390" y="60" width="145" height="140" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <rect x="390" y="60" width="145" height="26" rx="8" fill="#fef3c7" />
    <text x="462.5" y="78" text-anchor="middle" class="gate-lbl">HUMAN GATE 1</text>
    <text x="462.5" y="106" text-anchor="middle" class="node-title" fill="#92400e">Schválení záměru</text>
    <text x="462.5" y="128" text-anchor="middle" class="node-sub" fill="#78350f">Člověk potvrdí,</text>
    <text x="462.5" y="146" text-anchor="middle" class="node-sub" fill="#78350f">že agent chápe cíl</text>
    <text x="462.5" y="166" text-anchor="middle" class="node-sub" fill="#78350f">a nespletl zadání</text>
    <text x="462.5" y="186" text-anchor="middle" class="badge-text" fill="#b45309">comment: approve</text>
  </g>

  <!-- Arrow Gate 1 -> 4 -->
  <path d="M 535 130 L 560 130" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />

  <!-- 4. Tvorba plánu -->
  <g filter="url(#shadow)">
    <rect x="565" y="60" width="145" height="140" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
    <rect x="565" y="60" width="145" height="26" rx="8" fill="#f5f3ff" />
    <text x="637.5" y="78" text-anchor="middle" class="badge-text" fill="#6d28d9">stav: planned</text>
    <text x="637.5" y="106" text-anchor="middle" class="node-title" fill="#4c1d95">3. Návrh plánu</text>
    <text x="637.5" y="128" text-anchor="middle" class="node-sub" fill="#475569">Vzniká podřízené</text>
    <text x="637.5" y="146" text-anchor="middle" class="node-sub" fill="#475569">Child Issue `Plan`</text>
    <text x="637.5" y="166" text-anchor="middle" class="node-sub" fill="#475569">s rozpisem kroků</text>
    <text x="637.5" y="186" text-anchor="middle" class="node-sub" fill="#7c3aed">• čeká na gate 2</text>
  </g>

  <!-- Arrow 4 -> Gate 2 -->
  <path d="M 710 130 L 735 130" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)" />

  <!-- 5. Human Gate 2 -->
  <g filter="url(#shadow)">
    <rect x="740" y="60" width="145" height="140" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <rect x="740" y="60" width="145" height="26" rx="8" fill="#fef3c7" />
    <text x="812.5" y="78" text-anchor="middle" class="gate-lbl">HUMAN GATE 2</text>
    <text x="812.5" y="106" text-anchor="middle" class="node-title" fill="#92400e">Schválení plánu</text>
    <text x="812.5" y="128" text-anchor="middle" class="node-sub" fill="#78350f">Člověk schválí</text>
    <text x="812.5" y="146" text-anchor="middle" class="node-sub" fill="#78350f">technický postup</text>
    <text x="812.5" y="166" text-anchor="middle" class="node-sub" fill="#78350f">před úpravou kódu</text>
    <text x="812.5" y="186" text-anchor="middle" class="badge-text" fill="#b45309">comment: approve</text>
  </g>

  <!-- TRANSITION CURVE: Gate 2 -> Row 2 Start (Branch Created) -->
  <path d="M 812.5 200 L 812.5 240 L 112.5 240 L 112.5 272" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-blue)" />

  <!-- SECTION 2: IMPLEMENTACE, VERIFIKACE A MERGE (Row 2) -->
  <rect x="25" y="250" width="870" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="45" y="268" class="phase-hdr" fill="#475569">FÁZE 2: AUTONOMNÍ IMPLEMENTACE, KONTROLA A INTEGRACE</text>

  <!-- 6. Větev a implementace -->
  <g filter="url(#shadow)">
    <rect x="40" y="280" width="145" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
    <rect x="40" y="280" width="145" height="26" rx="8" fill="#f0f9ff" />
    <text x="112.5" y="298" text-anchor="middle" class="badge-text" fill="#0369a1">branch created</text>
    <text x="112.5" y="324" text-anchor="middle" class="node-title" fill="#0c4a6e">4. Kódování</text>
    <text x="112.5" y="344" text-anchor="middle" class="node-sub" fill="#475569">Izolovaná větev</text>
    <text x="112.5" y="362" text-anchor="middle" class="node-sub" fill="#475569">Agent píše kód</text>
    <text x="112.5" y="380" text-anchor="middle" class="node-sub" fill="#475569">a doplňuje testy</text>
    <text x="112.5" y="398" text-anchor="middle" class="node-sub" fill="#475569">Lokální cyklus úprav</text>
    <text x="112.5" y="418" text-anchor="middle" class="badge-text" fill="#0284c7">git checkout -b</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 185 355 L 210 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />

  <!-- 7. Ověření a Self-Review -->
  <g filter="url(#shadow)">
    <rect x="215" y="280" width="145" height="150" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="1.6" />
    <rect x="215" y="280" width="145" height="26" rx="8" fill="#f0fdfa" />
    <text x="287.5" y="298" text-anchor="middle" class="badge-text" fill="#0f766e">self-review</text>
    <text x="287.5" y="324" text-anchor="middle" class="node-title" fill="#134e4a">5. Verifikace</text>
    <text x="287.5" y="344" text-anchor="middle" class="node-sub" fill="#475569">Vlastní přezkoumání</text>
    <text x="287.5" y="362" text-anchor="middle" class="node-sub" fill="#475569">Ověření proti plánu</text>
    <text x="287.5" y="380" text-anchor="middle" class="node-sub" fill="#475569">Spuštění linteru</text>
    <text x="287.5" y="398" text-anchor="middle" class="node-sub" fill="#475569">a testovací sady</text>
    <text x="287.5" y="418" text-anchor="middle" class="badge-text" fill="#0d9488">pytest / lint PASS</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 360 355 L 385 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr-gray)" />

  <!-- 8. Otevření Pull Requestu -->
  <g filter="url(#shadow)">
    <rect x="390" y="280" width="145" height="150" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.6" />
    <rect x="390" y="280" width="145" height="26" rx="8" fill="#eef2ff" />
    <text x="462.5" y="298" text-anchor="middle" class="badge-text" fill="#4338ca">PR open</text>
    <text x="462.5" y="324" text-anchor="middle" class="node-title" fill="#312e81">6. Návrh změny</text>
    <text x="462.5" y="344" text-anchor="middle" class="node-sub" fill="#475569">Bot otevře PR</text>
    <text x="462.5" y="362" text-anchor="middle" class="node-sub" fill="#475569">Odkaz: Closes #issue</text>
    <text x="462.5" y="380" text-anchor="middle" class="node-sub" fill="#475569">Běh CI pipeline</text>
    <text x="462.5" y="398" text-anchor="middle" class="node-sub" fill="#475569">Vygenerování náhledu</text>
    <text x="462.5" y="418" text-anchor="middle" class="badge-text" fill="#4f46e5">github-actions[bot]</text>
  </g>

  <!-- Arrow 8 -> Gate 3 -->
  <path d="M 535 355 L 560 355" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arr-amber)" />

  <!-- 9. Human Gate 3 (PR Review) -->
  <g filter="url(#shadow)">
    <rect x="565" y="280" width="145" height="150" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    <rect x="565" y="280" width="145" height="26" rx="8" fill="#fef3c7" />
    <text x="637.5" y="298" text-anchor="middle" class="gate-lbl">HUMAN GATE 3</text>
    <text x="637.5" y="324" text-anchor="middle" class="node-title" fill="#92400e">Přezkoumání PR</text>
    <text x="637.5" y="344" text-anchor="middle" class="node-sub" fill="#78350f">Kontrola diffu kódu</text>
    <text x="637.5" y="362" text-anchor="middle" class="node-sub" fill="#78350f">Výsledek testů zelený</text>
    <text x="637.5" y="380" text-anchor="middle" class="node-sub" fill="#78350f">Finální schválení</text>
    <text x="637.5" y="398" text-anchor="middle" class="node-sub" fill="#78350f">pro sloučení do main</text>
    <text x="637.5" y="418" text-anchor="middle" class="badge-text" fill="#b45309">PR Review: Approve</text>
  </g>

  <!-- Arrow Gate 3 -> 10 -->
  <path d="M 710 355 L 735 355" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />

  <!-- 10. Auto-merge a uzavření -->
  <g filter="url(#shadow)">
    <rect x="740" y="280" width="145" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <rect x="740" y="280" width="145" height="26" rx="8" fill="#dcfce7" />
    <text x="812.5" y="298" text-anchor="middle" class="badge-text" fill="#15803d">auto-merge</text>
    <text x="812.5" y="324" text-anchor="middle" class="node-title" fill="#14532d">7. Dokončení</text>
    <text x="812.5" y="344" text-anchor="middle" class="node-sub" fill="#15803d">Squash &amp; merge do main</text>
    <text x="812.5" y="362" text-anchor="middle" class="node-sub" fill="#15803d">Smazání větve</text>
    <text x="812.5" y="380" text-anchor="middle" class="node-sub" fill="#15803d">Uzavření parent issue</text>
    <text x="812.5" y="398" text-anchor="middle" class="node-sub" fill="#15803d">Aktualizace nástěnky</text>
    <text x="812.5" y="418" text-anchor="middle" class="badge-text" fill="#166534">Issue Closed: DONE</text>
  </g>
</svg>
