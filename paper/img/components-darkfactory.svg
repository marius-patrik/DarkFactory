<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>

    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
  </defs>

  <style>
    .layer-hdr { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: bold; letter-spacing: 0.6px; }
    .box-title { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; }
    .box-sub { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 11px; }
    .code-fn { font-family: 'Courier New', monospace; font-size: 10.5px; font-weight: bold; }
    .conn-lbl { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 9.5px; font-weight: 600; }
  </style>

  <!-- Outer canvas -->
  <rect x="10" y="10" width="900" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ================= LAYER 1: REPOZITÁŘ & GITHUB PLATFORM (TOP) ================= -->
  <rect x="25" y="24" width="870" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="45" y="44" class="layer-hdr" fill="#475569">1. ÚROVEŇ REPOZITÁŘE A PLATFORMY GITHUB</text>

  <!-- Box 1.1: Konfigurační soubor -->
  <g filter="url(#shadow)">
    <rect x="40" y="55" width="200" height="72" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.6" />
    <rect x="40" y="55" width="200" height="22" rx="7" fill="#f0f9ff" />
    <text x="50" y="70" class="code-fn" fill="#0369a1">darkfactory.json</text>
    <text x="50" y="94" class="box-title" fill="#0c4a6e">Deklarace repozitáře</text>
    <text x="50" y="112" class="box-sub" fill="#64748b">Oblasti (areas), nástěnky, verze</text>
  </g>

  <!-- Box 1.2: GitHub Issues & Webhooky -->
  <g filter="url(#shadow)">
    <rect x="260" y="55" width="200" height="72" rx="7" fill="#ffffff" stroke="#6366f1" stroke-width="1.6" />
    <rect x="260" y="55" width="200" height="22" rx="7" fill="#eef2ff" />
    <text x="270" y="70" class="code-fn" fill="#4338ca">GitHub Issues &amp; Events</text>
    <text x="270" y="94" class="box-title" fill="#312e81">Vstup zadání a gates</text>
    <text x="270" y="112" class="box-sub" fill="#64748b">Doslovný požadavek, komentáře</text>
  </g>

  <!-- Box 1.3: GitHub Projects v2 -->
  <g filter="url(#shadow)">
    <rect x="480" y="55" width="190" height="72" rx="7" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.6" />
    <rect x="480" y="55" width="190" height="22" rx="7" fill="#f5f3ff" />
    <text x="490" y="70" class="code-fn" fill="#6d28d9">Projects v2 (Kanban)</text>
    <text x="490" y="94" class="box-title" fill="#4c1d95">Globální nástěnka</text>
    <text x="490" y="112" class="box-sub" fill="#64748b">7 stavů (Backlog až Done)</text>
  </g>

  <!-- Box 1.4: Branch Protection & PR -->
  <g filter="url(#shadow)">
    <rect x="690" y="55" width="190" height="72" rx="7" fill="#ffffff" stroke="#10b981" stroke-width="1.6" />
    <rect x="690" y="55" width="190" height="22" rx="7" fill="#ecfdf5" />
    <text x="700" y="70" class="code-fn" fill="#047857">Pull Request &amp; CI</text>
    <text x="700" y="94" class="box-title" fill="#064e3b">Požadované kontroly</text>
    <text x="700" y="112" class="box-sub" fill="#64748b">Ochrana větve, auto-merge</text>
  </g>

  <!-- Inter-layer vertical links (1 -> 2) -->
  <path d="M 140 127 L 140 165" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arr-blue)" />
  <path d="M 360 127 L 360 165" fill="none" stroke="#6366f1" stroke-width="1.6" marker-end="url(#arr-indigo)" />
  <path d="M 575 165 L 575 133" fill="none" stroke="#8b5cf6" stroke-width="1.6" marker-end="url(#arr-indigo)" />
  <path d="M 785 165 L 785 133" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#arr-emerald)" />

  <!-- ================= LAYER 2: DARKFACTORY CORE (SCRIPTS) ================= -->
  <rect x="25" y="170" width="870" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="45" y="190" class="layer-hdr" fill="#475569">2. VÝKONNÉ JÁDRO ARCHITEKTURY (.github/scripts/)</text>

  <!-- Component 2.1: agent_runner.py -->
  <g filter="url(#shadow)">
    <rect x="40" y="202" width="220" height="104" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect x="40" y="202" width="220" height="24" rx="8" fill="#eff6ff" />
    <text x="50" y="218" class="code-fn" fill="#1d4ed8">agent_runner.py</text>
    <text x="50" y="242" class="box-title" fill="#1e3a8a">Pipeline Orchestrátor</text>
    <text x="50" y="260" class="box-sub" fill="#475569">• Interpretace &amp; Plánování</text>
    <text x="50" y="277" class="box-sub" fill="#475569">• Kódování, Testy &amp; Seberecenze</text>
    <text x="50" y="294" class="box-sub" fill="#475569">• Kontrola souladu s plánem</text>
  </g>

  <!-- Component 2.2: harnesses.py -->
  <g filter="url(#shadow)">
    <rect x="280" y="202" width="200" height="104" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8" />
    <rect x="280" y="202" width="200" height="24" rx="8" fill="#eef2ff" />
    <text x="290" y="218" class="code-fn" fill="#4338ca">harnesses.py</text>
    <text x="290" y="242" class="box-title" fill="#312e81">Abstrakce poskytovatelů</text>
    <text x="290" y="260" class="box-sub" fill="#475569">• Žebříček kvót &amp; rotace účtů</text>
    <text x="290" y="277" class="box-sub" fill="#475569">• Antigravity, Claude, Codex</text>
    <text x="290" y="294" class="box-sub" fill="#475569">• Standardizace CLI rozhraní</text>
  </g>

  <!-- Component 2.3: project_automation.py -->
  <g filter="url(#shadow)">
    <rect x="500" y="202" width="180" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="500" y="202" width="180" height="24" rx="8" fill="#f5f3ff" />
    <text x="510" y="218" class="code-fn" fill="#6d28d9">project_automation.py</text>
    <text x="510" y="242" class="box-title" fill="#4c1d95">Správa nástěnky</text>
    <text x="510" y="260" class="box-sub" fill="#475569">• GraphQL API klient</text>
    <text x="510" y="277" class="box-sub" fill="#475569">• Mutace stavů v projektu</text>
    <text x="510" y="294" class="box-sub" fill="#475569">• Směrování dle oblastí (areas)</text>
  </g>

  <!-- Component 2.4: handle_pr_approval.py & open_pr.py -->
  <g filter="url(#shadow)">
    <rect x="700" y="202" width="180" height="104" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" />
    <rect x="700" y="202" width="180" height="24" rx="8" fill="#ecfdf5" />
    <text x="710" y="218" class="code-fn" fill="#047857">open_pr / handle_pr</text>
    <text x="710" y="242" class="box-title" fill="#064e3b">Správa Pull Requestů</text>
    <text x="710" y="260" class="box-sub" fill="#475569">• Založení PR botem</text>
    <text x="710" y="277" class="box-sub" fill="#475569">• Odchyt schválení člověkem</text>
    <text x="710" y="294" class="box-sub" fill="#475569">• Automatický squash-merge</text>
  </g>

  <!-- Inter-component arrows in Layer 2 -->
  <path d="M 260 254 L 274 254" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-gray)" />
  <path d="M 480 254 L 494 254" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-gray)" />
  <path d="M 680 254 L 694 254" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-gray)" />

  <!-- Inter-layer vertical links (2 -> 3) -->
  <path d="M 150 306 L 150 354" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-blue)" />
  <path d="M 380 306 L 380 354" fill="none" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#arr-indigo)" />
  <path d="M 760 306 L 760 354" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arr-emerald)" />

  <!-- ================= LAYER 3: BĚHOVÉ PROSTŘEDÍ A IZOLACE (BOTTOM) ================= -->
  <rect x="25" y="360" width="870" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="45" y="380" class="layer-hdr" fill="#475569">3. BĚHOVÉ PROSTŘEDÍ, IZOLACE A EXTERNÍ MODELY</text>

  <!-- Box 3.1: Docker Sandbox -->
  <g filter="url(#shadow)">
    <rect x="40" y="392" width="220" height="70" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
    <rect x="40" y="392" width="220" height="22" rx="7" fill="#f1f5f9" />
    <text x="50" y="407" class="code-fn" fill="#1e293b">docker/Dockerfile.agent</text>
    <text x="50" y="430" class="box-title" fill="#0f172a">Hermetický sandbox</text>
    <text x="50" y="448" class="box-sub" fill="#64748b">Izolace agenta od hostitelského CI runneru</text>
  </g>

  <!-- Box 3.2: Git Workspace & Checkpointing -->
  <g filter="url(#shadow)">
    <rect x="280" y="392" width="260" height="70" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
    <rect x="280" y="392" width="260" height="22" rx="7" fill="#f1f5f9" />
    <text x="290" y="407" class="code-fn" fill="#1e293b">Git strom &amp; .checkpoint.json</text>
    <text x="290" y="430" class="box-title" fill="#0f172a">Pracovní větev a štafeta</text>
    <text x="290" y="448" class="box-sub" fill="#64748b">Atomický diff, serializace kontextu pro handover</text>
  </g>

  <!-- Box 3.3: LLM Providers & CLI Tools -->
  <g filter="url(#shadow)">
    <rect x="560" y="392" width="320" height="70" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.6" />
    <rect x="560" y="392" width="320" height="22" rx="7" fill="#f1f5f9" />
    <text x="570" y="407" class="code-fn" fill="#1e293b">CLI Harnessy &amp; Modely</text>
    <text x="570" y="430" class="box-title" fill="#0f172a">Antigravity / Claude Code / Codex / Kimi</text>
    <text x="570" y="448" class="box-sub" fill="#64748b">Exekuce nástrojů, přístup k API a terminálu</text>
  </g>

</svg>
