<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="t d">
  <title id="t">Skládání zprávy a kompakce v Claude Code</title>
  <desc id="d">Kontextové okno se plní od systémového promptu a nástrojů přes zadání až po střídající se myšlenky, volání nástrojů a jejich výsledky. Když se blíží hranice, kompakce nahradí přepis souhrnem, kterému zbude místo; dál se pokračuje s posledním krokem a pěti naposledy otevřenými soubory. Výsledky starších nástrojů se čistí, poznámky se ukládají mimo okno a soubory se načítají až když je agent potřebuje.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .label{font:700 19px Caladea,serif;fill:#1a1a1a}
    .row{font:15px Caladea,serif;fill:#1a1a1a}
    .stale{font:italic 15px Caladea,serif;fill:#8a8a8a}
    .small{font:italic 14px Caladea,serif;fill:#5a5a5a}
    .note{font:15px Caladea,serif;fill:#333}
    .bold{font:700 15px Caladea,serif;fill:#1a1a1a}
    .win{fill:#fff;stroke:#1a1a1a;stroke-width:1.8}
    .limit{fill:none;stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:6 5}
    .arrow{fill:none;stroke:#1a1a1a;stroke-width:1.8;marker-end:url(#a)}
  </style>

  <text x="40" y="40" class="label">Do této chvíle</text>
  <text x="40" y="62" class="small">okno se plní každým krokem smyčky</text>
  <rect x="40" y="120" width="400" height="300" rx="6" class="win"/>

  <rect x="56" y="144" width="368" height="26" fill="#d9d9d9"/>
  <rect x="56" y="170" width="368" height="26" fill="#d9d9d9"/>
  <rect x="56" y="196" width="368" height="26" fill="#d9d9d9"/>
  <rect x="56" y="222" width="368" height="26" fill="#eeeeee"/>
  <rect x="56" y="248" width="368" height="26" fill="#f6f6f6"/>
  <rect x="56" y="274" width="368" height="26" fill="#f6f6f6"/>
  <rect x="56" y="300" width="368" height="26" fill="#f6f6f6"/>
  <rect x="56" y="326" width="368" height="26" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  <rect x="56" y="352" width="368" height="26" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  <rect x="56" y="378" width="368" height="26" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>

  <text x="68" y="162" class="bold">systémový prompt</text>
  <text x="68" y="188" class="row">nástroje</text>
  <text x="68" y="214" class="row">CLAUDE.md</text>
  <text x="68" y="240" class="row">zadání</text>
  <text x="68" y="266" class="row">myšlenka</text>
  <text x="68" y="292" class="row">volání nástroje</text>
  <text x="68" y="318" class="row">výsledek nástroje</text>
  <text x="68" y="344" class="stale">myšlenka</text>
  <text x="68" y="370" class="stale">volání nástroje</text>
  <text x="68" y="396" class="stale">výsledek nástroje</text>

  <line x1="40" y1="136" x2="440" y2="136" class="limit"/>
  <text x="40" y="112" class="small">hranice okna — začíná být těsno</text>

  <path d="M456 270H516" class="arrow"/>
  <text x="486" y="256" text-anchor="middle" class="bold">kompakce</text>

  <text x="540" y="40" class="label">Po kompakci</text>
  <text x="540" y="62" class="small">totéž okno, znovu otevřené</text>
  <rect x="540" y="120" width="400" height="300" rx="6" class="win"/>

  <rect x="556" y="250" width="368" height="80" fill="#b8b8b8"/>
  <rect x="556" y="334" width="368" height="46" fill="#d9d9d9"/>
  <rect x="556" y="384" width="368" height="26" fill="#f6f6f6"/>

  <text x="568" y="272" class="bold">shrnutí přepisu</text>
  <text x="568" y="296" class="row">architektonická rozhodnutí,</text>
  <text x="568" y="318" class="row">nevyřešené chyby, co bylo provedeno</text>
  <text x="568" y="362" class="row">5 naposledy otevřených souborů</text>
  <text x="568" y="403" class="row">poslední krok</text>

  <text x="556" y="200" class="small">místo uvolněné pro další práci,</text>
  <text x="556" y="222" class="small">nikoli pro další přepis</text>

  <line x1="40" y1="452" x2="940" y2="452" stroke="#c8c8c8" stroke-width="1.2"/>

  <text x="40" y="480" class="note">Výsledky starších nástrojů se vyčistí:</text>
  <text x="40" y="502" class="small">v hluboké historii je už nikdo nepotřebuje číst znovu</text>

  <text x="380" y="480" class="note">Poznámky žijí mimo okno</text>
  <text x="380" y="502" class="small">seznam úkolů se načte zpět, když je potřeba</text>

  <text x="700" y="480" class="note">Soubory se načítají</text>
  <text x="700" y="502" class="small">až když je agent potřebuje</text>
</svg>
