<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Sémantický vztah mezi vektory slov</title>
  <desc id="d">Dvourozměrný náčrt vektorových reprezentací slov král, královna, muž a žena. Vodorovná osa značí pohlaví, svislá královský status. Vztahy mezi mužem a ženou a mezi králem a královnou jsou rovnoběžné, takže platí v(král) minus v(muž) plus v(žena) přibližně rovná v(královna).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .axis{stroke:#1a1a1a;stroke-width:2;marker-end:url(#a)}
    .rel{stroke:#1a1a1a;stroke-width:2.2;stroke-dasharray:9 6;marker-end:url(#a)}
    .lab{font:700 20px Caladea,serif;fill:#1a1a1a}
    .axlab{font:700 19px Caladea,serif;fill:#1a1a1a}
    .eq{font:700 19px Caladea,serif;fill:#1a1a1a}
  </style>

  <line x1="165" y1="410" x2="770" y2="410" class="axis"/>
  <line x1="165" y1="410" x2="165" y2="95" class="axis"/>
  <text x="775" y="442" text-anchor="end" class="axlab">Pohlaví</text>
  <text x="122" y="110" transform="rotate(-90 122 110)" text-anchor="end" class="axlab">Královský status</text>

  <line x1="300" y1="365" x2="625" y2="365" class="rel"/>
  <line x1="300" y1="180" x2="625" y2="180" class="rel"/>
  <line x1="300" y1="360" x2="300" y2="195" class="rel"/>
  <line x1="625" y1="360" x2="625" y2="195" class="rel"/>

  <circle cx="300" cy="365" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="625" cy="365" r="9" fill="#1a1a1a"/>
  <circle cx="300" cy="180" r="9" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="625" cy="180" r="9" fill="#1a1a1a"/>

  <text x="279" y="395" text-anchor="end" class="lab">muž</text>
  <text x="647" y="395" class="lab">žena</text>
  <text x="279" y="165" text-anchor="end" class="lab">král</text>
  <text x="647" y="165" class="lab">královna</text>

  <rect x="200" y="455" width="500" height="45" rx="5" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="450" y="484" text-anchor="middle" class="eq">v(král) − v(muž) + v(žena) ≈ v(královna)</text>
</svg>
