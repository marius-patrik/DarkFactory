<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="t d">
  <title id="t">Agentní smyčka: model navrhuje, harness provádí a vrací pozorování</title>
  <desc id="d">Čtyři kroky se střídají v uzavřeném cyklu. Harness sestaví kontext, model z něj zvolí další krok, harness požadavek na nástroj provede a výsledek mu vrátí jako pozorování; cyklus se opakuje, dokud model místo požadavku na nástroj nevydá závěrečnou odpověď, čímž smyčka končí.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#1a1a1a;stroke-width:1.8}
    .soft{fill:#e0e0e0;stroke:#1a1a1a;stroke-width:1.8}
    .label{font:700 18px Caladea,serif;fill:#1a1a1a}
    .owner{font:700 11px Caladea,serif;letter-spacing:.6px;fill:#1a1a1a}
    .small{font:italic 14px Caladea,serif;fill:#5a5a5a}
    .note{font:italic 15px Caladea,serif;fill:#333}
    .arrow{fill:none;stroke:#1a1a1a;stroke-width:1.8;marker-end:url(#a)}
  </style>

  <text x="40" y="34" class="label">Model navrhuje, harness provádí a vrací pozorování</text>
  <text x="40" y="56" class="small">jeden cyklus smyčky; cyklus se opakuje, dokud model neodpoví</text>

  <rect x="516" y="24" width="14" height="14" rx="3" class="box"/>
  <text x="538" y="36" class="small">krok navrhuje model</text>
  <rect x="516" y="48" width="14" height="14" rx="3" class="soft"/>
  <text x="538" y="60" class="small">krok provádí harness</text>

  <!-- 1. context, assembled by the harness -->
  <rect x="60" y="112" width="230" height="92" rx="6" class="soft"/>
  <text x="175" y="136" text-anchor="middle" class="owner">HARNESS SESTAVÍ</text>
  <text x="175" y="162" text-anchor="middle" class="label">Kontext</text>
  <text x="175" y="188" text-anchor="middle" class="small">instrukce, historie, stav</text>

  <!-- 2. the model chooses the next step -->
  <rect x="375" y="112" width="230" height="92" rx="6" class="box"/>
  <text x="490" y="136" text-anchor="middle" class="owner">MODEL NAVRHUJE</text>
  <text x="490" y="162" text-anchor="middle" class="label">Volba dalšího kroku</text>
  <text x="490" y="188" text-anchor="middle" class="small">myšlenka, pak žádost o nástroj</text>

  <!-- 3. the harness executes the request -->
  <rect x="690" y="112" width="230" height="92" rx="6" class="soft"/>
  <text x="805" y="136" text-anchor="middle" class="owner">HARNESS PROVÁDÍ</text>
  <text x="805" y="162" text-anchor="middle" class="label">Nástroj / akce</text>
  <text x="805" y="188" text-anchor="middle" class="small">čtení, editace, test</text>

  <path d="M290 158H369" class="arrow"/>
  <path d="M605 158H684" class="arrow"/>

  <!-- exit: answering instead of asking for a tool ends the loop -->
  <path d="M490 204V256" class="arrow"/>
  <rect x="375" y="256" width="230" height="66" rx="6" class="box"/>
  <text x="490" y="284" text-anchor="middle" class="label">Odpověď</text>
  <text x="490" y="308" text-anchor="middle" class="small">místo žádosti o nástroj — smyčka končí</text>

  <!-- 4. observation returns to the context -->
  <rect x="690" y="366" width="230" height="92" rx="6" class="soft"/>
  <text x="805" y="390" text-anchor="middle" class="owner">HARNESS VRÁCÍ</text>
  <text x="805" y="416" text-anchor="middle" class="label">Pozorování</text>
  <text x="805" y="442" text-anchor="middle" class="small">výsledek akce, ne předpoklad</text>

  <path d="M805 204V360" class="arrow"/>

  <path d="M690 412H290V204" class="arrow"/>
  <text x="490" y="426" text-anchor="middle" class="note">opakovat do ukončení</text>

  <text x="40" y="500" class="note">Každý krok se připojí k přepisu, takže model navazuje na to, co už viděl;</text>
  <text x="40" y="522" class="note">požadavek na nástroj posílá harness, ne prostředí, a jeho výsledek se vrací do kontextu.</text>
</svg>