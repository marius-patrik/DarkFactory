<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Agentická smyčka ReAct</title>
  <desc id="d">Model navrhne akci, harness ji zprostředkuje a provede v běhovém prostředí, výsledek se stane pozorováním a vrací se do dalšího kroku. Smyčka může být kdykoli ukončena výsledkem, tedy závěrečnou odpovědí místo dalšího požadavku na nástroj.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#1a1a1a;stroke-width:1.8}
    .soft{fill:#f4f4f4;stroke:#1a1a1a;stroke-width:1.8}
    .label{font:700 20px Caladea,serif;fill:#1a1a1a}
    .sub{font:15px Caladea,serif;fill:#333}
    .edge{fill:none;stroke:#1a1a1a;stroke-width:1.8;marker-end:url(#a)}
    .edgelab{font:italic 14px Caladea,serif;fill:#333}
  </style>

  <rect x="60" y="60" width="230" height="96" rx="6" class="box"/>
  <text x="175" y="100" text-anchor="middle" class="label">Model</text>
  <text x="175" y="128" text-anchor="middle" class="sub">inference, kontext</text>

  <rect x="610" y="60" width="230" height="96" rx="6" class="box"/>
  <text x="725" y="100" text-anchor="middle" class="label">Akce</text>
  <text x="725" y="128" text-anchor="middle" class="sub">požadavek modelu</text>

  <rect x="610" y="264" width="230" height="96" rx="6" class="soft"/>
  <text x="725" y="304" text-anchor="middle" class="label">Nástroj / prostředí</text>
  <text x="725" y="332" text-anchor="middle" class="sub">provedeno mimo model</text>

  <rect x="60" y="264" width="230" height="96" rx="6" class="box"/>
  <text x="175" y="304" text-anchor="middle" class="label">Pozorování</text>
  <text x="175" y="332" text-anchor="middle" class="sub">skutečný výsledek akce</text>

  <path d="M290 108H604" class="edge"/>
  <path d="M725 156V258" class="edge"/>
  <path d="M604 312H296" class="edge"/>
  <path d="M175 258V162" class="edge"/>

  <rect x="355" y="176" width="190" height="68" rx="6" class="soft"/>
  <text x="450" y="206" text-anchor="middle" class="label">Výsledek</text>
  <text x="450" y="230" text-anchor="middle" class="sub">závěrečná odpověď</text>

  <path d="M240 162C280 200,315 210,349 210" class="edge"/>
  <text x="288" y="188" text-anchor="middle" class="edgelab">hotovo</text>

  <text x="450" y="404" text-anchor="middle" class="edgelab">Harness přidává každý krok do přepisu konverzace a výsledek nástroje vrací modelu jako nové pozorování.</text>
</svg>
