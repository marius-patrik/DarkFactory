<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d">
  <title id="t">Jednoduchý průchod požadavku DarkFactory</title>
  <desc id="d">Požadavek v issue prochází interpretací, plánováním a dvěma lidskými bránami, poté implementací na pracovní větvi, ověřením, draft pull requestem a review smyčkou s nejvýše třemi iteracemi. Po schválení následuje merge a odstranění větve.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 1L10 5L0 9Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .phase{fill:none;stroke:#1a1a1a;stroke-width:1.2;stroke-dasharray:5 4}
    .box{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}
    .gate{fill:#f4f4f4;stroke:#1a1a1a;stroke-width:2.2}
    .plabel{font:700 10.5px Caladea,serif;letter-spacing:.7px;fill:#1a1a1a}
    .head{font:700 13px Caladea,serif;fill:#1a1a1a}
    .body{font:11.5px Caladea,serif;fill:#333}
    .gatetxt{font:700 10px Caladea,serif;letter-spacing:.5px;fill:#1a1a1a}
    .mono{font:11px 'DejaVu Sans Mono',monospace;fill:#1a1a1a}
    .note{font:italic 11px Caladea,serif;fill:#444}
    .rev{font:700 11px 'DejaVu Sans Mono',monospace;fill:#555}
    .title{font:700 17px Caladea,serif;fill:#1a1a1a}
    .edge{fill:none;stroke:#1a1a1a;stroke-width:1.6;marker-end:url(#a)}
  </style>

  <text x="30" y="36" class="title">Jednoduchý průchod požadavku</text>
  <text x="970" y="35" text-anchor="end" class="rev">d576ec8f</text>

  <!-- phase 1 -->
  <rect x="30" y="52" width="940" height="134" rx="7" class="phase"/>
  <text x="46" y="72" class="plabel">SPECIFIKACE A LIDSKÉ BRÁNY</text>

  <rect x="46" y="88" width="140" height="70" rx="5" class="box"/>
  <text x="116" y="116" text-anchor="middle" class="head">Požadavek</text>
  <text x="116" y="138" text-anchor="middle" class="body">issue / komentář</text>

  <path d="M186 123H212" class="edge"/>

  <rect x="212" y="88" width="150" height="70" rx="5" class="box"/>
  <text x="287" y="116" text-anchor="middle" class="head">Interpretace</text>
  <text x="287" y="138" text-anchor="middle" class="body">rozsah a kritéria</text>

  <path d="M362 123H388" class="edge"/>

  <rect x="388" y="88" width="150" height="70" rx="5" class="gate"/>
  <text x="463" y="112" text-anchor="middle" class="gatetxt">LIDSKÁ BRÁNA</text>
  <text x="463" y="138" text-anchor="middle" class="head">Schválení</text>

  <path d="M538 123H564" class="edge"/>

  <rect x="564" y="88" width="150" height="70" rx="5" class="box"/>
  <text x="639" y="116" text-anchor="middle" class="head">Plán</text>
  <text x="639" y="138" text-anchor="middle" class="body">soubory a kroky</text>

  <path d="M714 123H740" class="edge"/>

  <rect x="740" y="88" width="214" height="70" rx="5" class="gate"/>
  <text x="847" y="112" text-anchor="middle" class="gatetxt">LIDSKÁ BRÁNA</text>
  <text x="847" y="138" text-anchor="middle" class="head">Schválení plánu</text>

  <!-- return flow, routed through the clear channel between the two phases -->
  <path d="M847 158V200H116V244" class="edge"/>

  <!-- phase 2 -->
  <rect x="30" y="214" width="940" height="138" rx="7" class="phase"/>
  <text x="46" y="234" class="plabel">IMPLEMENTACE, REVIEW A INTEGRACE</text>

  <rect x="46" y="250" width="140" height="70" rx="5" class="box"/>
  <text x="116" y="278" text-anchor="middle" class="head">Větev</text>
  <text x="116" y="300" text-anchor="middle" class="body">izolace změn</text>

  <path d="M186 285H212" class="edge"/>

  <rect x="212" y="250" width="150" height="70" rx="5" class="box"/>
  <text x="287" y="278" text-anchor="middle" class="head">Implementace</text>
  <text x="287" y="300" text-anchor="middle" class="mono">claude / codex</text>

  <path d="M362 285H388" class="edge"/>

  <rect x="388" y="250" width="150" height="70" rx="5" class="box"/>
  <text x="463" y="278" text-anchor="middle" class="head">Ověření</text>
  <text x="463" y="300" text-anchor="middle" class="body">formátování, testy</text>

  <path d="M538 285H564" class="edge"/>

  <rect x="564" y="250" width="150" height="70" rx="5" class="box"/>
  <text x="639" y="278" text-anchor="middle" class="head">Draft PR</text>
  <text x="639" y="300" text-anchor="middle" class="body">diff a scope</text>

  <path d="M714 285H740" class="edge"/>

  <rect x="740" y="250" width="214" height="70" rx="5" class="gate"/>
  <text x="847" y="274" text-anchor="middle" class="gatetxt">REVIEW ↔ FIX</text>
  <text x="847" y="300" text-anchor="middle" class="head">Nejvýše 3 iterace</text>

  <path d="M847 320V336H639V326" class="edge"/>

  <text x="500" y="386" text-anchor="middle" class="note">Po čisté review a kontrole souladu se schváleným plánem se pull request předá člověku.</text>
  <text x="500" y="408" text-anchor="middle" class="note">Schválení spustí merge s odstraněním pracovní větve; opakování téhož nálezu bez progresu běh zablokuje.</text>
</svg>
