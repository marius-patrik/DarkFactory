<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
    .subtitle { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 10.5px; fill: #64748b; }
    .body-text { font-family: 'Carlito', 'Caladea', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #334155; }
    .code-text { font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; font-weight: 600; fill: #1e293b; }
    .status-pass { font-family: 'Carlito', 'Caladea', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #059669; }
    .status-fail { font-family: 'Carlito', 'Caladea', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #e11d48; }
  </style>

  <!-- Canvas Outer Container -->
  <rect x="5" y="5" width="830" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- ========================================================================= -->
  <!-- CARD 1: Zdrojové soubory                                                   -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="20" y="22" width="165" height="205" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  </g>
  <rect x="20" y="22" width="165" height="38" rx="8" fill="#f1f5f9" />
  <circle cx="34" cy="41" r="5" fill="#3b82f6" />
  <text x="46" y="38" class="title">Zdrojový kód</text>
  <text x="46" y="52" class="subtitle">Living Documentation</text>

  <rect x="28" y="70" width="149" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0" />
  <text x="36" y="85" class="body-text">Python docstrings</text>
  <text x="36" y="97" class="code-text">Google-style format</text>

  <rect x="28" y="112" width="149" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0" />
  <text x="36" y="127" class="body-text">TypeScript / JS</text>
  <text x="36" y="139" class="code-text">TSDoc /** ... */</text>

  <rect x="28" y="154" width="149" height="34" rx="5" fill="#ffffff" stroke="#e2e8f0" />
  <text x="36" y="169" class="body-text">Rust komentáře</text>
  <text x="36" y="181" class="code-text">cargo doc ///</text>

  <!-- Connection Arrow 1 -> 2 -->
  <path d="M 185 105 L 217 105" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr-slate)" />

  <!-- ========================================================================= -->
  <!-- CARD 2: CI Striktní verifikace                                             -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="225" y="22" width="205" height="205" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" />
  </g>
  <rect x="225" y="22" width="205" height="38" rx="8" fill="#f3e8ff" />
  <circle cx="240" cy="41" r="5" fill="#8b5cf6" />
  <text x="252" y="38" class="title">CI Striktní verifikace</text>
  <text x="252" y="52" class="subtitle">Validační brána v GitHub Actions</text>

  <!-- Command Badge -->
  <rect x="235" y="68" width="185" height="26" rx="5" fill="#1e1b4b" />
  <text x="245" y="85" font-family="'Consolas', monospace" font-size="10.5px" fill="#a7f3d0">$ properdocs --strict</text>

  <!-- Verification Checks -->
  <g transform="translate(235, 106)">
    <circle cx="6" cy="7" r="3" fill="#8b5cf6" />
    <text x="16" y="11" class="body-text">Kontrola přítomnosti docstringů</text>

    <circle cx="6" cy="27" r="3" fill="#8b5cf6" />
    <text x="16" y="31" class="body-text">Validace křížových odkazů</text>

    <circle cx="6" cy="47" r="3" fill="#8b5cf6" />
    <text x="16" y="51" class="body-text">Shoda typových anotací</text>
  </g>

  <!-- Failure sub-box -->
  <rect x="235" y="172" width="185" height="42" rx="5" fill="#fff1f2" stroke="#fecdd3" />
  <circle cx="246" cy="186" r="4" fill="#e11d48" />
  <text x="256" y="189" class="status-fail">SELHÁNÍ: Chybějící dokumentace</text>
  <text x="256" y="203" font-family="system-ui" font-size="9.5px" fill="#9f1239">Blokace PR → agent opraví chybu</text>

  <!-- Connection Arrow 2 -> 3 (SUCCESS) -->
  <path d="M 430 80 L 465 80" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arr-emerald)" />
  <text x="435" y="73" class="status-pass">ÚSPĚCH</text>

  <!-- ========================================================================= -->
  <!-- CARD 3: Sestavení portálu                                                  -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="475" y="22" width="175" height="205" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
  </g>
  <rect x="475" y="22" width="175" height="38" rx="8" fill="#dcfce7" />
  <circle cx="490" cy="41" r="5" fill="#10b981" />
  <text x="502" y="38" class="title">Sestavení portálu</text>
  <text x="502" y="52" class="subtitle">Statický dokumentační generátor</text>

  <g transform="translate(485, 72)">
    <rect x="0" y="0" width="155" height="36" rx="5" fill="#ffffff" stroke="#bbf7d0" />
    <text x="10" y="16" class="body-text">Extrakce AST stromu</text>
    <text x="10" y="29" class="code-text">JSON sémantická mapa</text>

    <rect x="0" y="44" width="155" height="36" rx="5" fill="#ffffff" stroke="#bbf7d0" />
    <text x="10" y="60" class="body-text">Statické HTML stránky</text>
    <text x="10" y="73" class="code-text">Responzivní navigace</text>

    <rect x="0" y="88" width="155" height="36" rx="5" fill="#ffffff" stroke="#bbf7d0" />
    <text x="10" y="104" class="body-text">Vyhledávací index</text>
    <text x="10" y="117" class="code-text">Klientský fulltext</text>
  </g>

  <!-- Connection Arrow 3 -> 4 -->
  <path d="M 650 105 L 677 105" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" />

  <!-- ========================================================================= -->
  <!-- CARD 4: Publikace na GitHub Pages                                          -->
  <!-- ========================================================================= -->
  <g filter="url(#shadow)">
    <rect x="685" y="22" width="135" height="205" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
  </g>
  <rect x="685" y="22" width="135" height="38" rx="8" fill="#dbeafe" />
  <circle cx="700" cy="41" r="5" fill="#2563eb" />
  <text x="712" y="38" class="title">Publikace</text>
  <text x="712" y="52" class="subtitle">GitHub Pages</text>

  <g transform="translate(695, 75)">
    <rect x="0" y="0" width="115" height="34" rx="5" fill="#ffffff" stroke="#bfdbfe" />
    <text x="8" y="15" class="body-text">Větev gh-pages</text>
    <text x="8" y="27" class="code-text">Atomický push</text>

    <rect x="0" y="44" width="115" height="34" rx="5" fill="#ffffff" stroke="#bfdbfe" />
    <text x="8" y="59" class="body-text">Okamžité zrcadlo</text>
    <text x="8" y="71" class="code-text">Živý deployment</text>

    <rect x="0" y="88" width="115" height="42" rx="5" fill="#ffffff" stroke="#bfdbfe" />
    <text x="8" y="103" class="body-text">100% shoda</text>
    <text x="8" y="118" font-family="system-ui" font-size="9px" fill="#1e40af">Žádná desynchronizace</text>
  </g>
</svg>
