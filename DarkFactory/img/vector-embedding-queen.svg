<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="relation" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="18" y="18" width="864" height="524" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="44" y="58" font-family="Carlito,Arial,sans-serif" font-size="20" font-weight="700" fill="#0f172a">3D projekce embeddingového vztahu král − muž + žena ≈ královna</text>
  <text x="44" y="84" font-family="Carlito,Arial,sans-serif" font-size="13" fill="#64748b">Ilustrativní projekce vysokodimenzionálního prostoru do tří rozměrů</text>

  <!-- origin and perspective axes -->
  <circle cx="210" cy="430" r="4" fill="#334155"/>
  <line x1="210" y1="430" x2="760" y2="430" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="430" x2="210" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="430" x2="520" y2="245" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="435" font-family="Carlito,Arial,sans-serif" font-size="13" fill="#64748b">d₁</text>
  <text x="198" y="112" font-family="Carlito,Arial,sans-serif" font-size="13" fill="#64748b">d₂</text>
  <text x="532" y="239" font-family="Carlito,Arial,sans-serif" font-size="13" fill="#64748b">d₃</text>

  <!-- guide plane -->
  <polygon points="300,390 555,330 650,205 395,265" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- four semantic points -->
  <circle cx="300" cy="390" r="10" fill="#2563eb"/>
  <circle cx="555" cy="330" r="10" fill="#db2777"/>
  <circle cx="395" cy="265" r="10" fill="#2563eb"/>
  <circle cx="650" cy="205" r="12" fill="#db2777" stroke="#9d174d" stroke-width="2"/>

  <g font-family="Carlito,Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    <text x="270" y="420">muž</text>
    <text x="555" y="360">žena</text>
    <text x="355" y="246">král</text>
    <text x="662" y="196">královna</text>
  </g>

  <!-- gender vector -->
  <line x1="315" y1="386" x2="540" y2="333" stroke="#e11d48" stroke-width="4" marker-end="url(#relation)"/>
  <line x1="410" y1="261" x2="635" y2="208" stroke="#e11d48" stroke-width="4" marker-end="url(#relation)"/>
  <text x="420" y="345" font-family="Carlito,Arial,sans-serif" font-size="14" font-weight="700" fill="#be123c">stejný relační posun</text>

  <!-- royalty vector -->
  <line x1="306" y1="378" x2="389" y2="278" stroke="#4f46e5" stroke-width="3" marker-end="url(#relation)"/>
  <line x1="561" y1="318" x2="644" y2="218" stroke="#4f46e5" stroke-width="3" marker-end="url(#relation)"/>

  <!-- equation -->
  <rect x="168" y="470" width="565" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="501" text-anchor="middle" font-family="Carlito,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">v(král) − v(muž) + v(žena) ≈ v(královna)</text>
</svg>