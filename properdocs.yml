site_name: DarkFactory
site_description: >-
  Autonomous, governed software delivery built around df, versioned capabilities and GitHub.
site_author: marius-patrik
repo_name: marius-patrik/DarkFactory
repo_url: https://github.com/marius-patrik/DarkFactory
edit_uri: edit/darkfactory/

docs_dir: .properdocs-source

# Deletion-bound renderer configuration used only by the current Pages implementation until
# @darkfactory/web consumes the native @darkfactory/docs content graph.
theme:
  name: null
  custom_dir: theme

# Navigation is generated from canonical repository documentation sources.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      # The page title is already the H1; repeating it in the table of contents adds a row that
      # links to where the reader already is.
      toc_depth: 2-4

plugins:
  - search

hooks:
  - .github/scripts/docs_hooks.py
