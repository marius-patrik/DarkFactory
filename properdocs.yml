site_name: DarkFactory
site_description: >-
  Turn-key template for autonomous, governed software engineering pipelines.
site_author: marius-patrik
repo_name: marius-patrik/DarkFactory
repo_url: https://github.com/marius-patrik/DarkFactory
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  # A first-party theme, owned outright rather than extended from a vendor's, so any part of the
  # markup can change without fighting an upstream stylesheet. Design system: shadcn/ui.
  name: null
  custom_dir: theme

# `nav` is generated by .github/scripts/docs_hooks.py so that adding a record to
# notes/adr/ publishes it with no configuration change (AGENTS.md rule 2).

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      # The page title is already the H1; repeating it in the table of contents adds a row that
      # links to where the reader already is.
      toc_depth: 2-4

plugins:
  - search

hooks:
  - .github/scripts/docs_hooks.py
