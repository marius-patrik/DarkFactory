# Isolated DF-11 acceptance. No credentials, publishing, deployment or branch promotion.
name: DF-11 Auth and Keychain Acceptance
on:
  push:
    branches:
      - agent/2700-auth-broker-df11
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: df11-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Typecheck, format and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Independently evaluate all quality gates
        run: |
          set +e
          bun run typecheck; types=$?
          bun run format:check; format=$?
          bun run lint; lint=$?
          printf 'typecheck=%s format=%s lint=%s\n' "$types" "$format" "$lint"
          test "$types" -eq 0 && test "$format" -eq 0 && test "$lint" -eq 0
  focused:
    name: Auth and keychain negative tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test ./.github/tests/auth/*.test.ts ./.github/tests/keychain/*.test.ts
  full:
    name: Complete test suite and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  format-preview:
    name: Isolated source formatting audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Preview formatted changes without writing to the repository
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/tests/auth/auth.test.ts
            .github/tests/auth/broker.test.ts
            .github/tests/auth/http.test.ts
            .github/tests/keychain/vault-tombstones.test.ts
            packages/auth/src/broker.ts
            packages/auth/src/client.ts
            packages/auth/src/http.ts
            packages/auth/src/permissions.ts
            packages/auth/src/types.ts
            packages/keychain/src/os-keychain.ts
            packages/keychain/src/vault.ts
            packages/keychain/src/vault-store.ts
            packages/keychain/src/vault-crypto.ts
          )
          bunx biome format --write "${files[@]}"
          for file in "${files[@]}"; do
            # The selected files contain source only, not deployed credentials.
            printf 'DF11_FORMAT_START %s ' "$file"
            base64 -w0 "$file"
            printf '\n'
          done
