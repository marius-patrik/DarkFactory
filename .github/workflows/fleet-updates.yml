name: Synchronize DarkFactory Fleet

# Follow the newest stable *released* binary, not the mutable main branch.
# GitHub suppresses some workflow events created with GITHUB_TOKEN, hence
# the daily reconciliation in addition to the published-release trigger.
on:
  # Reconcile eligible consumers after every release, producer merge, and scheduled sweep.
  push:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Bootstrap per-repo and Global boards after hourly owner quota resets.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect only; create no issues or pull requests"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: darkfactory-fleet-release-updates
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'marius-patrik/DarkFactory'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DARKFACTORY_APP_ID: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
      DF_FLEET_OWNER: ${{ github.repository_owner }}
      DF_FLEET_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      DF_FLEET_CONSUMERS_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fleet reconciliation
        env:
          DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
        run: node scripts/fleet-sync.mjs

  projects:
    if: github.repository == 'marius-patrik/DarkFactory' && !inputs.dry_run
    name: Reconcile scoped and Global projects
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DARKFACTORY_APP_ID: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
      DF_FLEET_OWNER: ${{ github.repository_owner }}
      DF_FLEET_CONSUMERS_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile every managed repository board and the shared Global board
        env:
          DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        run: node scripts/fleet-projects.mjs
