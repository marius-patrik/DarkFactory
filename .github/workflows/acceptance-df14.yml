name: DF-14 Independent Adversarial Production Acceptance

on:
  push:
    branches: [agent/2706-independent-acceptance-df14]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: df14-independent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    name: Real fault and security probes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Cross-process crashes and torn journals
        run: bun test --timeout 30000 ./.github/tests/acceptance/process-faults.test.ts
      - name: Supply-chain candidate traversal, SHA, secrets and symlinks
        if: success() || failure()
        run: bun test --timeout 30000 ./.github/tests/acceptance/artifact-integrity.test.ts
      - name: Adversarial OAuth, review, checks and webhook semantics
        if: success() || failure()
        run: bun test --timeout 30000 ./.github/tests/acceptance/security-boundaries.test.ts

  quality:
    name: Exact-head full repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run typecheck
      - name: Biome format check
        if: success() || failure()
        run: bun run format:check
      - name: Biome lint
        if: success() || failure()
        run: bun run lint
      - name: Complete Bun test suite including intentionally failing adversarial probes
        if: success() || failure()
        run: bun run test

  source-free:
    name: Native source-free artifact and unified Web/Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Verify production Web/Docs build, manifest and local HTTP readback
        run: bun test --timeout 180000 ./.github/tests/web/manifest-acceptance.test.ts
      - name: Compile native Linux df
        run: bun run build --target=linux-x64
      - name: Execute detached source-free CLI and verify archive digests
        run: bun packages/harness/scripts/verify-target.ts --target linux-x64
