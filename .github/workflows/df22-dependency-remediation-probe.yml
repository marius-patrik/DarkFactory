# One-time read-only DF22 dependency remediation experiment. No remote writes or releases.
name: DF22 Dependency Remediation Probe
on:
  push:
    branches: [agent/2709-candidate-verification-df22]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  dependency-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Resolve security-patched transitive dependencies in a disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          jq '.dependencies.zod = "4.6.6" | .overrides = {"undici":"8.12.2","markdown-it":"14.3.3","minimatch":"11.0.1"}' package.json > package.new.json
          mv package.new.json package.json
          bun install --ignore-scripts
          set +e
          bun audit --json > "$RUNNER_TEMP/remediation-audit.json"
          status=$?
          set -e
          echo "REMEDIATED_AUDIT_EXIT=$status"
          cat "$RUNNER_TEMP/remediation-audit.json"
          for item in package.json bun.lock; do
            echo "DF22_ENCODED_BEGIN:$item"
            base64 -w 0 "$item" | fold -w 400
            echo "DF22_ENCODED_END:$item"
            sha256sum "$item"
          done
