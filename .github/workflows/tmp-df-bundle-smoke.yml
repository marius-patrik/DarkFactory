name: Temporary DF Bundle Smoke
on:
  pull_request:
  push:
    branches: [feat/released-df-installer-1166]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bun run build --target=linux-x64
      - run: bun packages/harness/scripts/verify-target.ts --target linux-x64
      - name: Show staged release files
        run: |
          ls -lah packages/harness/dist
          tar -tzf packages/harness/dist/df-linux-x64.tar.gz | head -30
