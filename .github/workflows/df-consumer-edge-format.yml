name: Format Consumer Edge Cases (self-removing)
on:
  push:
    branches: [fix/df-gitlink-consumer-install]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'marius-patrik/DarkFactory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/df-gitlink-consumer-install
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply canonical formatting and safe lint fixes
        run: |
          bunx biome format --write scripts/fleet-control.mjs scripts/fleet-sync.mjs scripts/fleet-control.test.mjs scripts/fleet-sync.test.mjs
          bunx biome lint --write scripts/fleet-control.mjs scripts/fleet-sync.mjs scripts/fleet-control.test.mjs scripts/fleet-sync.test.mjs || true
      - name: Commit formatting and remove one-time workflow
        run: |
          git rm .github/workflows/df-consumer-edge-format.yml
          git add scripts/fleet-control.mjs scripts/fleet-sync.mjs scripts/fleet-control.test.mjs scripts/fleet-sync.test.mjs
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "style(df): canonicalize consumer migration and branch cleanup" 
          git push origin HEAD:fix/df-gitlink-consumer-install
