name: Project Board Automation

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  pull_request:
    types: [opened, edited, closed, ready_for_review, reopened]
  push:
    branches: [darkfactory]
  workflow_dispatch:

  # Consumers call this rather than copying it, so the scripts it runs live in one place.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
    secrets:
      GH_PROJECT_TOKEN: {required: false}

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  automate-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .pipeline/.github/scripts ]; then
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Project Board Automation
        run: |
          python3 "${PIPELINE_SCRIPTS:-.github/scripts}/project_automation.py"
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          # Only a fallback now: which boards to write to comes from the manifest, so an unset
          # variable no longer silently points every repository at project 1.
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
