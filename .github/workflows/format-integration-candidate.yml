name: Format integration candidate
on:
  push:
    branches: [integrate/final-fleet-2026-10-16]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/integrate/final-fleet-2026-10-16'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format candidate files
        run: |
          bunx --bun biome format --write packages/harness/src/ci/quality-runner.ts packages/harness/test/ci/quality-runner.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/harness/src/ci/quality-runner.ts packages/harness/test/ci/quality-runner.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(ci): normalize quality runner and interpreter tests"
            git push origin HEAD:integrate/final-fleet-2026-10-16
          fi
