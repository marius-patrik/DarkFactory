name: Sync Paper PDF

on:
  push:
    branches: [docs/thesis]
    paths:
      - "paper/**"
      - "scripts/paper/**"
      - ".github/workflows/sync-paper-pdf.yml"

permissions:
  contents: write

concurrency:
  group: sync-paper-pdf-docs-thesis
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout thesis branch
        uses: actions/checkout@v4
        with:
          ref: docs/thesis
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publication PDF
        run: bun run --cwd paper publication

      - name: Commit refreshed PDF
        run: |
          if git diff --quiet -- PAPER.pdf; then
            echo "PAPER.pdf already matches the manuscript."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAPER.pdf
          git commit -m "docs(paper): regenerate PDF"
          git push origin HEAD:docs/thesis
