name: DarkFactory Self-Hosted Control

# Prove the production GitHub Actions reusable-workflow runtime, not just YAML
# parsing or a downloaded binary. The producer's canonical managed workflow is versioned on main with its source.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  managed:
    uses: ./.github/workflows/darkfactory-control.yml
    secrets: inherit
