name: CI

on:
  push:
    branches: ["darkfactory"]
  pull_request:
    branches: ["darkfactory"]
  workflow_dispatch:
  # The same file is this repository's own CI and the reusable workflow every consumer calls, so
  # the two cannot drift. A consumer's caller stub is six lines and pins `pipeline-ref` to a SHA;
  # everything below then runs against the *caller's* checkout, because `github.repository` in a
  # called workflow is the caller.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"

# Every job below always reports a conclusion, even while the product tree is still a scaffold:
# language-specific steps are guarded by `hashFiles`, so the job succeeds with skipped steps rather
# than being skipped itself. A skipped job never satisfies a required status check, which would
# block every merge forever.
jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the pinned pipeline
        # Only when called from another repository: the shared scripts live in the pipeline
        # repository at a pinned SHA, so a consumer carries none of them in its own tree.
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .pipeline/.github/scripts ]; then
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        run: black --check --diff .

      - name: Run repository automation tests
        run: pytest -v

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: detect
        run: echo "present=${{ hashFiles('Cargo.toml') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace

      - name: No Rust workspace yet
        if: steps.detect.outputs.present != 'true'
        run: echo "No Cargo.toml at the repository root; nothing to build. See ROADMAP.md epic E1."

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect web workspace
        id: detect
        run: echo "present=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.detect.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: bun run --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: bun run --if-present typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: bun run --if-present test

      - name: No web workspace yet
        if: steps.detect.outputs.present != 'true'
        run: echo "No package.json at the repository root; nothing to build. See ROADMAP.md epic E2."

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        # The command comes from the *caller's* environment, not from this file. Consumers do not
        # share a documentation engine - this repository builds with mkdocs and omnis with
        # properdocs - so hardcoding one here fails in every repository that chose the other.
        run: |
          SCRIPTS=".github/scripts"
          [ -d .pipeline/.github/scripts ] && SCRIPTS=".pipeline/.github/scripts"
          COMMAND=$(PYTHONPATH="$SCRIPTS" python - <<'PY'
          import environment

          plan = environment.configure(".").docs_plan()
          # One repository, one documentation site: the first ecosystem that declares a build owns
          # it. A polyglot repository publishes one site from several inline sources.
          for entry in plan.values():
              if entry.get("command"):
                  print(entry["command"])
                  break
          PY
          )
          if [ -z "$COMMAND" ]; then
            echo "No documentation build is configured for this repository."
            exit 0
          fi
          echo "Documentation build: $COMMAND"
          eval "$COMMAND"
