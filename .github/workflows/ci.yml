name: CI

on:
  push:
    branches: [develop]
  # No `branches` filter on `pull_request`. That filter matches the pull request's *base* ref, so
  # scoping it to `develop` left every stacked pull request in the delivery chain with zero
  # check-runs: no `detect`, no `quality`, and a `CLEAN` mergeStateStatus computed from nothing
  # (the stack branches are unprotected, so no required check ever gated them). One pull request
  # in that state showed a `success` that had been computed against a different base.
  # `edited` is in `types` because a base-only change is the one pull request edit that invalidates
  # the previous base's results; GitHub emits no `synchronize` for it. `push` and `merge_group`
  # stay scoped to the integration branch, so a stack branch's own pushes do not fan out.
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: darkfactory-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-actions: ${{ steps.matrix.outputs.has-actions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned DarkFactory runtime
        if: github.repository != 'marius-patrik/DarkFactory'
        uses: actions/checkout@v4
        with:
          repository: "marius-patrik/DarkFactory"
          ref: "main"
          path: .darkfactory-runtime

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install DarkFactory runtime
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun install --frozen-lockfile --cwd "$ROOT"

      - name: Resolve detected quality matrix
        id: matrix
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun "$ROOT/packages/cli/src/bin.ts" ci matrix             --repo "$GITHUB_WORKSPACE"             --capabilities-root "$ROOT/capabilities" > "$RUNNER_TEMP/darkfactory-quality.json"
          jq -c '.matrix' "$RUNNER_TEMP/darkfactory-quality.json"             | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
          if [ "$(jq '.matrix | length' "$RUNNER_TEMP/darkfactory-quality.json")" -gt 0 ]; then
            echo "has-actions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-actions=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(jq '.gaps | length' "$RUNNER_TEMP/darkfactory-quality.json")" -gt 0 ]; then
            echo "::warning::DarkFactory detected unsupported or missing deterministic actions:"
            jq -r '.gaps[] | "  \(.packageId) \(.kind): \(.reason // .description)"'               "$RUNNER_TEMP/darkfactory-quality.json"
          fi

  quality-run:
    name: ${{ matrix.id }}
    needs: detect
    if: needs.detect.outputs.has-actions == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        # The paper capability resolves its entrypoint with a repository script, so the typst
        # job needs bun too even though it is not a bun job.
        if: matrix.packageManager == 'bun' || matrix.ecosystem == 'typst'
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        if: matrix.ecosystem == 'node' && matrix.packageManager != 'bun'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        if: matrix.packageManager == 'pnpm' || matrix.packageManager == 'yarn'
        run: corepack enable

      - name: Set up Python
        if: matrix.ecosystem == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version || '3.13' }}

      - name: Install Python package manager
        if: matrix.packageManager == 'uv' || matrix.packageManager == 'poetry' || matrix.packageManager == 'pipenv'
        env:
          DF_PACKAGE_MANAGER: ${{ matrix.packageManager }}
        run: python -m pip install "$DF_PACKAGE_MANAGER"

      - name: Set up Rust
        if: matrix.ecosystem == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Go
        if: matrix.ecosystem == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Set up Deno
        if: matrix.ecosystem == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Typst
        # The paper package's own test compiles the manuscript, so its job needs typst even
        # though it is a node job.
        if: matrix.ecosystem == 'typst' || matrix.cwd == 'paper'
        uses: typst-community/setup-typst@v5

      - name: Set up Lean
        if: matrix.ecosystem == 'lean'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Set up TeX Live
        if: matrix.ecosystem == 'latex'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Install package dependencies
        if: matrix.setupCommand != ''
        env:
          DF_SETUP_COMMAND: ${{ matrix.setupCommand }}
          DF_SETUP_CWD: ${{ matrix.setupCwd }}
        run: |
          cd "$GITHUB_WORKSPACE/$DF_SETUP_CWD"
          bash -lc "$DF_SETUP_COMMAND"

      - name: Run detected quality action
        env:
          DF_ACTION_COMMAND: ${{ matrix.command }}
          DF_ACTION_CWD: ${{ matrix.cwd }}
          DF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          cd "$GITHUB_WORKSPACE/$DF_ACTION_CWD"
          bash -lc "$DF_ACTION_COMMAND"

  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect combined configuration docs block
        id: docs
        env:
          DF_CONFIG_DIR: ${{ env.DF_CONFIG_DIR }}
        run: |
          # The one-config-per-scope candidate matrix. It is the same rule
          # `.github/scripts/resolver.py` enforces for the runtime, and
          # `tests/test_workflows.py::test_the_workflow_gate_and_the_resolver_agree_on_the_candidate_matrix`
          # runs both against the same fixtures so the two cannot drift.
          CONFIG_FILENAMES="repo.dfconfig config.dfconfig .dfconfig"
          DEFAULT_CONFIG_DIR=".darkfactory"
          # Lexical path normalisation, the equivalent of the resolver's `os.path.normpath`: collapse
          # `.`, `..` and repeated separators without touching the filesystem. `realpath -m` would
          # also resolve symlinks, which the resolver does not, and is a GNU-only option.
          normpath() {
            local path="$1" out="" part saved_ifs="$IFS"
            IFS="/"
            set -f
            for part in $path; do
              case "$part" in
                ""|".") ;;
                "..") out="${out%/*}" ;;
                *) out="$out/$part" ;;
              esac
            done
            set +f
            IFS="$saved_ifs"
            printf '%s' "${out:-/}"
          }
          count_candidates() {
            local dir="$1" n=0 name
            for name in $CONFIG_FILENAMES; do
              if [ -f "$dir/$name" ]; then n=$((n + 1)); fi
            done
            printf '%s' "$n"
          }
          # A blank or whitespace-only value is the default, matching the resolver's `.strip() or`.
          CONFIG_DIR="${DF_CONFIG_DIR}"
          CONFIG_DIR="${CONFIG_DIR#"${CONFIG_DIR%%[![:space:]]*}"}"
          CONFIG_DIR="${CONFIG_DIR%"${CONFIG_DIR##*[![:space:]]}"}"
          CONFIG_DIR="${CONFIG_DIR:-$DEFAULT_CONFIG_DIR}"
          WORKSPACE="$(normpath "$GITHUB_WORKSPACE")"
          case "$CONFIG_DIR" in
            /*) FOLDER="$(normpath "$CONFIG_DIR")" ;;
            *) FOLDER="$(normpath "$WORKSPACE/$CONFIG_DIR")" ;;
          esac
          COUNT="$(count_candidates "$WORKSPACE")"
          if [ "$FOLDER" != "$WORKSPACE" ]; then
            COUNT=$((COUNT + $(count_candidates "$FOLDER")))
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "Ambiguous DarkFactory configuration: keep only one repo.dfconfig, config.dfconfig, or .dfconfig candidate." >&2
            exit 1
          fi
          if [ "$COUNT" -eq 1 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pinned DarkFactory runtime
        if: steps.docs.outputs.present == 'true' && github.repository != 'marius-patrik/DarkFactory'
        uses: actions/checkout@v4
        with:
          repository: "marius-patrik/DarkFactory"
          ref: "main"
          path: .darkfactory-runtime

      - name: Set up Bun
        if: steps.docs.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install DarkFactory runtime
        if: steps.docs.outputs.present == 'true'
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun install --frozen-lockfile --cwd "$ROOT"

      - name: Build native documentation
        if: steps.docs.outputs.present == 'true'
        run: |
          ROOT="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/.darkfactory-runtime" ]; then
            ROOT="$GITHUB_WORKSPACE/.darkfactory-runtime"
          fi
          bun "$ROOT/scripts/build-docs.ts" --repo-root "$GITHUB_WORKSPACE" --check

      - name: No documentation configured
        if: steps.docs.outputs.present != 'true'
        run: echo "No combined configuration docs block; native documentation check is not applicable."

  quality:
    name: quality
    if: always()
    needs: [detect, quality-run, docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce detected quality result
        env:
          DF_DETECT_RESULT: ${{ needs.detect.result }}
          DF_HAS_ACTIONS: ${{ needs.detect.outputs.has-actions }}
          DF_QUALITY_RESULT: ${{ needs.quality-run.result }}
          DF_DOCS_RESULT: ${{ needs.docs-check.result }}
        run: |
          test "$DF_DETECT_RESULT" = "success"
          test "$DF_DOCS_RESULT" = "success"
          if [ "$DF_HAS_ACTIONS" = "true" ]; then
            test "$DF_QUALITY_RESULT" = "success"
          else
            test "$DF_QUALITY_RESULT" = "skipped"
          fi
