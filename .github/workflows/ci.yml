name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Install workspace dependencies
        run: bun install

      - name: Build publication and validate web
        run: bun run check

      - name: Install Chromium for browser acceptance
        run: cd web && bunx playwright install --with-deps chromium

      - name: Run browser acceptance
        run: bun run web:acceptance

      - name: Assemble Pages output
        run: bun run site:assemble
