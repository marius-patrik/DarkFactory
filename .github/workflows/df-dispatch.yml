name: DF Dispatch (Shadow)

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'

workflow_call:
  inputs:
    pipeline-repo:
      description: "Repository holding the runner and the container definition."
      required: false
      type: string
      default: "marius-patrik/DarkFactory"
    pipeline-ref:
      description: "Commit SHA or ref of the pipeline repository to run. Empty means default."
      required: false
      type: string
      default: "darkfactory"

jobs:
  dispatch:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: darkfactory/pipeline
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .darkfactory-pipeline

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .darkfactory-pipeline/harness

      - name: Run DF Dispatch (shadow mode)
        run: |
          bun .darkfactory-pipeline/harness/src/cli.ts graph dispatch --event-name "$GITHUB_EVENT_NAME" --event "$GITHUB_EVENT_PATH" --shadow --summary "$GITHUB_STEP_SUMMARY"
