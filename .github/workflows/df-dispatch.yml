name: DF Dispatch (Shadow)

# Shadow mode (#242): df evaluates the workflow graph on live events and writes the node it would dispatch to the
# job summary. It performs no writes: read-only permissions, no state persisted, no comments, labels or pushes.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_call:
    inputs:
      pipeline-repo:
        description: "Repository holding the df harness and the workflow graph."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
      pipeline-ref:
        description: "Commit SHA or ref of the pipeline repository. Empty means its default branch."
        required: false
        type: string
        default: ""

jobs:
  dispatch:
    # Bot ingress is filtered before any work, like agent.yml; scheduled runs have no sender.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo || 'marius-patrik/DarkFactory' }}
          ref: ${{ inputs.pipeline-ref }}
          path: .darkfactory-pipeline

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .darkfactory-pipeline/harness

      - name: Run DF Dispatch (shadow mode)
        env:
          GH_TOKEN: ${{ github.token }}
          DF_SHADOW_VERIFY: "true"
          DF_PYTHON_ACTION_PATH: ${{ github.workspace }}/.darkfactory-pipeline/harness/assets/python_action.json
        run: |
          bun .darkfactory-pipeline/harness/src/cli.ts graph dispatch --event-name "$GITHUB_EVENT_NAME" --event "$GITHUB_EVENT_PATH" --graph .darkfactory-pipeline/harness/assets/graph.darkfactory.json --shadow --summary "$GITHUB_STEP_SUMMARY"
