name: One-time layout migration
on:
  push:
    branches: [refactor/unify-agents-plugins-scripts-tests-20261102]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Execute layout migration
        run: node .github/scripts/one-time-restructure.mjs
      - name: Remove temporary workflow before validating production workflow contracts
        run: git rm .github/workflows/one-time-restructure.yml
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format
        run: bun run format
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx biome lint . --diagnostic-level=error --max-diagnostics=1000
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Documentation
        run: bun run docs
      - name: Remove temporary migration scripts and commit the verified result
        run: |
          git rm -f --ignore-unmatch .github/scripts/one-time-restructure.mjs
          # GitHub Actions GITHUB_TOKEN cannot alter workflow files. A follow-up
          # GitHub integration edit will apply verified workflow relocations.
          git restore --source="$GITHUB_SHA" --staged --worktree .github/workflows
          git add -A
          git diff --cached --check
          git config user.name darkfactory-layout-bot
          git config user.email darkfactory-layout-bot@users.noreply.github.com
          git commit -m 'refactor(layout): unify agents plugins scripts and tests'
      - name: Publish validated isolated branch through git
        run: |
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/refactor/unify-agents-plugins-scripts-tests-20261102
          echo "Validated tree: $(git rev-parse HEAD^{tree})"
          echo "Validated commit: $(git rev-parse HEAD)"
