name: Temporary Installer Lint Diagnostics
on:
  push:
    branches: [feat/released-df-installer-1166]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: List lint errors only
        shell: bash
        run: |
          bunx biome lint . --max-diagnostics=1000 --reporter=json > /tmp/biome-diagnostics.json || true
          node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("/tmp/biome-diagnostics.json", "utf8"));
            console.log(JSON.stringify((d.diagnostics || []).filter(x=>x.severity === "error").map(x=>({category:x.category,message:x.description || x.message,location:x.location?.path?.file,x})), null, 2).slice(0,10000));
          '
