name: Temporary Format Fleet Files
on:
  push:
    branches: [feat/fleet-release-updates-2051]
permissions:
  contents: write
concurrency:
  group: temp-fleet-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/fleet-release-updates-2051
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format files
        run: bunx biome format --write scripts/fleet-sync.mjs scripts/fleet-sync.test.mjs
      - name: Commit formatting only
        run: |
          if git diff --quiet -- scripts/fleet-sync.mjs scripts/fleet-sync.test.mjs; then
            echo 'Already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fleet-sync.mjs scripts/fleet-sync.test.mjs
          git commit -m 'style(ci): format fleet-sync sources'
          git push origin HEAD:feat/fleet-release-updates-2051
