name: Deploy Documentation

on:
  push:
    branches: ["darkfactory"]
  workflow_dispatch:

# Published to the `gh-pages` branch rather than through the Pages build action, so that per-pull-
# request previews can live under `pr-<N>/` on the same site. GitHub Pages has one source, so the
# two cannot use different mechanisms. `.github/darkfactory.json` declares the same source, and
# `tests/test_pipeline_config.py` fails if the two disagree - the first deploy 404s otherwise.
permissions:
  contents: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Fetch the published site to see which builds exist
        # The switcher lists what is really on `gh-pages`, not what this run believes it
        # published, so a preview torn down by hand disappears on the next deploy.
        run: |
          git fetch origin gh-pages --depth=1 || true
          rm -rf .published && mkdir -p .published
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git --work-tree=.published checkout origin/gh-pages -- . 2>/dev/null || true
          fi

      - name: Write the version manifest
        run: |
          python .github/scripts/docs_versions.py \
            --site-root .published \
            --repo-root . \
            --current "${{ github.ref_name }}" \
            --out site/versions.json

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          # Replace the site, but never a live pull request preview.
          clean: true
          clean-exclude: |
            pr-*
          commit-message: "docs: publish site from ${{ github.sha }}"
