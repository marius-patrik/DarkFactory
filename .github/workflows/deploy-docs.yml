name: Publish Verified DarkFactory Web and Documentation

# No ordinary main push or unapproved candidate may overwrite the live Pages site.
on:
  workflow_dispatch:
    inputs:
      web_build_run_id:
        description: "Actions run id containing the DF-03 immutable web candidate artifact"
        type: string
        required: true
      candidate_sha:
        description: "Exact Git commit SHA from approved source/candidate"
        type: string
        required: true
      promote:
        description: "Explicitly publish the site (only an approved SemVer release tag)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: darkfactory-pages-publication
  cancel-in-progress: false

jobs:
  candidate:
    name: verify-unified-site-candidate
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact commit binding
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DF_PROMOTE: ${{ inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          if [[ "$DF_PROMOTE" == "true" ]]; then
            [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
              echo "::error::Production promotion requires a SemVer tag"; exit 1;
            }
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Verify promoted version and main ancestry
        if: ${{ inputs.promote }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(bun -p 'JSON.parse(await Bun.file("package.json").text()).version')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag and package version disagree"; exit 1;
          }
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::Candidate is not contained in main"; exit 1;
          }
      - name: Install exact workspace
        run: bun install --frozen-lockfile
      - name: Validate trusted DF-03 producing workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_BUILD_RUN_ID: ${{ inputs.web_build_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WEB_BUILD_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::DF-03 artifact run id must be numeric"; exit 1;
          }
          # This deliberately fails until the audited DF-03 producer exists.
          workflow="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/build-web.yml")"
          workflow_id="$(jq -er 'select(.path == ".github/workflows/build-web.yml" and .state == "active") | .id' <<< "$workflow")"
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$WEB_BUILD_RUN_ID" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" --argjson workflow_id "$workflow_id" '
              .workflow_id == $workflow_id and
              .head_sha == $sha and
              .head_branch == $branch and
              .head_repository.full_name == $repo and
              .status == "completed" and
              .conclusion == "success" and
              (.event == "push" or .event == "workflow_dispatch") and
              .run_attempt >= 1
            '
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$WEB_BUILD_RUN_ID/artifacts?per_page=100" |
            jq -e '[.artifacts[] | select(.name == "darkfactory-web-candidate" and (.expired | not) and .size_in_bytes > 0)] | length == 1'
      - name: Download DF-03 frontend handoff
        uses: actions/download-artifact@v4
        with:
          name: darkfactory-web-candidate
          run-id: ${{ inputs.web_build_run_id }}
          github-token: ${{ github.token }}
          path: web-dist
      - name: Compile and validate docs
        run: bun scripts/build-docs.ts --check
      - name: Resolve Pages project/custom base path
        env:
          CONFIGURED_BASE: ${{ vars.DF_PAGES_BASE_PATH }}
        run: |
          if [[ -n "$CONFIGURED_BASE" ]]; then
            echo "DF_PAGES_BASE_PATH=$CONFIGURED_BASE" >> "$GITHUB_ENV"
          else
            echo "DF_PAGES_BASE_PATH=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"
          fi
      - name: Package verified immutable Web and Docs
        run: bun scripts/build-docs.ts --web-dist web-dist --out site
      - name: Inspect required staged files
        run: |
          test -s site/index.html
          test -s site/docs/index.html
          test -s site/docs/content.json
          test -s site/docs/search.json
          test -s site/docs/reference-cli/index.html
          test -s site/site-manifest.json
          test -f site/.nojekyll
          if test -e site/guide-getting-started-installation/index.html; then echo "::error::Docs leaked into application root"; exit 1; fi
          test -s site/docs/guide-getting-started-installation/index.html
          bun -e 'const x=await Bun.file("site/site-manifest.json").json(); if(x.status!=="unpublished-candidate" || x.sourceSha!==process.env.GITHUB_SHA || !x.files.some((f)=>f.path==="docs/index.html"))process.exit(1)'
      - name: Inspect a clean extraction, manifest and SHA-256 checksums
        run: |
          tar -czf "$RUNNER_TEMP/unified-site.tgz" -C site .
          mkdir "$RUNNER_TEMP/unified-site-extracted"
          tar -xzf "$RUNNER_TEMP/unified-site.tgz" -C "$RUNNER_TEMP/unified-site-extracted"
          bun scripts/build-docs.ts --verify-artifact "$RUNNER_TEMP/unified-site-extracted"
      - name: Preserve candidate for source and independent release review
        uses: actions/upload-artifact@v4
        with:
          name: darkfactory-unified-site-candidate
          path: site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: human-authorized-live-pages-deployment
    if: ${{ inputs.promote && startsWith(github.ref, 'refs/tags/v') }}
    needs: candidate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Obtain precisely verified candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: darkfactory-unified-site-candidate
          path: site
      - uses: actions/configure-pages@v5
      - name: Upload immutable Pages candidate
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish after environment approval
        id: deployment
        uses: actions/deploy-pages@v4
