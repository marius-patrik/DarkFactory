name: Report Pipeline Failure

# Runs after another workflow finishes, rather than inside it: a workflow that fails partway
# through cannot be relied on to report its own failure, and a job appended to each one would have
# to be repeated in every workflow.
on:
  workflow_run:
    # Matched by *display name*. A name matching no workflow is not an error - it simply never
    # fires - which is how failures of the agent went unreported for as long as this said "Agent"
    # and the workflow had been renamed "Autonomous Agent". A test now checks every name here
    # against the workflows that exist.
    workflows:
      - Autonomous Agent
      - Branch Policy
      - CI
      - DarkFactory Self-Hosted Control
      - Deploy Documentation
      - Install Pipeline
      - Install Sweep
      - Open Pull Request
      - Quota Resume Sweep
      - PR Approval and Auto-Merge
      - Validate Documentation
      - Project Board Automation
      - Release
      - Synchronize DarkFactory Fleet
      - Update Submodules
      - Verify Bound Issue
      - Verify DarkFactory Self-Installation
    types: [completed]


permissions:
  actions: read
  contents: read
  issues: write

# Serial observers reconcile the latest completed default-branch run. GitHub can
# coalesce pending jobs, so each surviving observer computes the current state.

jobs:
  report:
    # Only a default-branch failure is a repository-wide operational incident.
    # PR checks report on their own PR, and must never open/close main failures.
    # This is an event-only observer, not a callable workflow. The runtime binds claimed
    # run metadata to the original triggering run ID.
    # The CLI separately verifies the observed run through the authenticated
    # Actions REST API before performing any incident issue mutations.
    if: >-
      github.event_name == 'workflow_run'
        && !startsWith(github.event.workflow_run.event, 'pull_request')
        && (github.event.workflow_run.event == 'push'
          || github.event.workflow_run.event == 'schedule'
          || github.event.workflow_run.event == 'workflow_dispatch'
          || github.event.workflow_run.event == 'repository_dispatch'
          || github.event.workflow_run.event == 'issues')
        && github.event.workflow_run.head_branch == github.event.repository.default_branch
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: incident-observer-${{ github.repository }}-${{ github.event.workflow_run.workflow_id }}
      cancel-in-progress: false
    name: report-failure
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read from a step-level `if`, so the test
      # is hoisted to the job, where it can.
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Mint an installation token for the App
        # Issue and pull request work belongs to the App, which has its own rate limit. Only
        # Projects v2 needs a person's token, because GitHub scopes project permissions to
        # organisations and these boards are user-owned.
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.11.0
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install DarkFactory runtime
        run: bun install --frozen-lockfile

      - name: File or resolve the failure issue
        # A df subcommand rather than a separate pipeline script.
        run: bun packages/cli/src/bin.ts report-failure
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          ACTIONS_READ_TOKEN: ${{ github.token }}
