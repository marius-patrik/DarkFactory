name: Report Pipeline Failure

# Runs after another workflow finishes, rather than inside it: a workflow that fails partway
# through cannot be relied on to report its own failure, and a job appended to each one would have
# to be repeated in every workflow.
on:
  workflow_run:
    workflows:
      - CI
      - Deploy Documentation
      - Project Board Automation
      - Release
      - Agent
    types: [completed]

  # Consumers call this rather than copying it, so the script it runs lives in one place.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
    secrets:
      GH_PROJECT_TOKEN: {required: false}

permissions:
  contents: read
  issues: write

concurrency:
  # One at a time per workflow, so two runs finishing together cannot both open an issue.
  group: report-failure-${{ github.event.workflow_run.name || github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: report-failure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .pipeline/.github/scripts ]; then
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: File or resolve the failure issue
        run: python3 "${PIPELINE_SCRIPTS:-.github/scripts}/report_failure.py"
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
