name: Verify Source-Free Candidate
on:
  pull_request:
    paths:
      - "packages/**"
      - ".darkfactory/plugins/**"
      - "scripts/**"
      - ".github/workflows/candidate-release.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - id: targets
        run: |
          bun packages/harness/scripts/release-targets.ts > "$RUNNER_TEMP/candidate-targets.json"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/candidate-targets.json")" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Build native source-free artifact
        run: bun run build --target=${{ matrix.target }}
      - name: Execute packaged artifact and verify SHA-256
        run: bun packages/harness/scripts/verify-target.ts --target ${{ matrix.target }}
      - name: Retain candidate bytes for provenance inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.target }}
          path: |
            packages/harness/dist/${{ matrix.asset }}
            packages/harness/dist/${{ matrix.asset }}.tar.gz
            packages/harness/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 3


  docker-agent-smoke:
    name: Build and run the unprivileged agent container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the actual agent Dockerfile
        run: docker build --progress=plain -f docker/Dockerfile.agent -t darkfactory-agent:candidate .
      - name: Execute published CLI contract as an unprivileged user
        run: |
          set -euo pipefail
          docker run --rm darkfactory-agent:candidate --help > "$RUNNER_TEMP/df-container-help.txt"
          grep -q 'providers' "$RUNNER_TEMP/df-container-help.txt"
          docker run --rm darkfactory-agent:candidate providers > "$RUNNER_TEMP/df-container-providers.txt"
          test -s "$RUNNER_TEMP/df-container-providers.txt"
          test "$(docker run --rm --entrypoint id darkfactory-agent:candidate -u)" = "1001"

  native-config-consumer:
    name: Verify BoardGamesWithQuests Python and ProperDocs semantic parity
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marius-patrik/BoardGamesWithQuests
          ref: bc4afead5d3b29a9c469a063cba6102a9eeabd3d
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-linux-x64
          path: candidate
      - name: Verify candidate checksum and stage the source-free DF
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check df-linux-x64.sha256
          mkdir -p "$RUNNER_TEMP/candidate-df"
          tar -xzf df-linux-x64.tar.gz -C "$RUNNER_TEMP/candidate-df"
          "$RUNNER_TEMP/candidate-df/df-linux-x64" --help >/dev/null
      - name: Project real consumer TOML/YAML without overwriting its authored files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML
          cd consumer
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import yaml
          root = pathlib.Path('.')
          py = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          docs = yaml.safe_load((root / 'properdocs.yml').read_text(encoding='utf-8'))
          config = json.loads((root / 'repo.dfconfig').read_text(encoding='utf-8'))
          config['repo']['environment']['native_pyproject'] = py
          config['docs']['site'] = {
              'name': docs['site_name'],
              'description': docs['site_description'],
          }
          config['docs']['native_properdocs'] = {
              k: v for k, v in docs.items() if k not in ('site_name', 'site_description')
          }
          (root / 'original-native-config.json').write_text(json.dumps({'py': py, 'docs': docs}), encoding='utf-8')
          (root / 'repo.dfconfig').write_text(json.dumps(config, indent=2), encoding='utf-8')
          (root / 'pyproject.toml').unlink()
          (root / 'properdocs.yml').unlink()
          PY
          "$RUNNER_TEMP/candidate-df/df-linux-x64" ci native-config --repo . --write
          "$RUNNER_TEMP/candidate-df/df-linux-x64" ci native-config --repo .
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import yaml
          root = pathlib.Path('.')
          original = json.loads((root / 'original-native-config.json').read_text(encoding='utf-8'))
          actual_py = tomllib.loads((root / 'pyproject.toml').read_text(encoding='utf-8'))
          actual_docs = yaml.safe_load((root / 'properdocs.yml').read_text(encoding='utf-8'))
          assert actual_py == original['py'], 'Generated pyproject.toml changed Python package semantics'
          assert actual_docs == original['docs'], 'Generated properdocs.yml changed site semantics'
          print('Python packaging and ProperDocs native configuration semantic parity: verified')
          PY
      - name: Verify actual editable package and strict documentation build
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          cd consumer
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip show chesswithquests
          python -c 'import engine; import chess; import checkers'
          python -m pytest -q
          python .github/scripts/build_docs.py
