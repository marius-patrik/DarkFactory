name: Verify Source-Free Candidate
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - id: targets
        run: |
          bun packages/harness/scripts/release-targets.ts > "$RUNNER_TEMP/candidate-targets.json"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/candidate-targets.json")" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Build native source-free artifact
        run: bun run build --target=${{ matrix.target }}
      - name: Execute packaged artifact and verify SHA-256
        run: bun packages/harness/scripts/verify-target.ts --target ${{ matrix.target }}
      - name: Retain candidate bytes for provenance inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.target }}
          path: |
            packages/harness/dist/${{ matrix.asset }}
            packages/harness/dist/${{ matrix.asset }}.tar.gz
            packages/harness/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 3


  docker-agent-smoke:
    name: Verify canonical Nix-built agent container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Nix
        uses: cachix/install-nix-action@v31
      - name: Build and load the canonical production agent image
        run: |
          set -euo pipefail
          nix build .#agentImage --no-write-lock-file -L -o "$RUNNER_TEMP/agent-image"
          docker load -i "$RUNNER_TEMP/agent-image"
      - name: Execute independent source-free, CLI, and non-root image contract
        run: bash .github/scripts/verify-agent-image.sh darkfactory-agent:nix

  candidate:
    name: candidate
    if: always()
    needs: [targets, build, docker-agent-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete native and non-root evidence
        env:
          DF_TARGETS_RESULT: ${{ needs.targets.result }}
          DF_BUILD_RESULT: ${{ needs.build.result }}
          DF_IMAGE_RESULT: ${{ needs.docker-agent-smoke.result }}
        run: |
          set -euo pipefail
          test "$DF_TARGETS_RESULT" = "success"
          test "$DF_BUILD_RESULT" = "success"
          test "$DF_IMAGE_RESULT" = "success"
