name: Verify Source-Free Candidate
on:
  pull_request:
    paths:
      - "packages/**"
      - ".darkfactory/plugins/**"
      - "scripts/**"
      - ".github/workflows/candidate-release.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-release-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - id: targets
        run: |
          bun packages/harness/scripts/release-targets.ts > "$RUNNER_TEMP/candidate-targets.json"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/candidate-targets.json")" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Build native source-free artifact
        run: bun run build --target=${{ matrix.target }}
      - name: Execute packaged artifact and verify SHA-256
        run: bun packages/harness/scripts/verify-target.ts --target ${{ matrix.target }}
      - name: Retain candidate bytes for provenance inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.target }}
          path: |
            packages/harness/dist/${{ matrix.asset }}
            packages/harness/dist/${{ matrix.asset }}.tar.gz
            packages/harness/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 3

  consumer-dsh-stack-quality:
    name: Validate actual dsh-stack PR 355 quality with one candidate runner
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marius-patrik/dsh-stack
          ref: 1565d4252e864438631ec8c3cbf227847d023750
          path: consumer
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-linux-x64
          path: candidate
      - name: Verify candidate archive and detect the full consumer action plan
        shell: bash
        run: |
          set -euo pipefail
          find candidate -type f -maxdepth 4
          RECORD=$(find candidate -name 'df-linux-x64.sha256' -type f -print -quit)
          test -n "$RECORD"
          cd "$(dirname "$RECORD")"
          sha256sum --check df-linux-x64.sha256
          mkdir -p "$RUNNER_TEMP/candidate-df"
          tar -xzf df-linux-x64.tar.gz -C "$RUNNER_TEMP/candidate-df"
          set +e
          "$RUNNER_TEMP/candidate-df/df-linux-x64" ci matrix --repo "$GITHUB_WORKSPACE/consumer" > "$RUNNER_TEMP/consumer-quality.json"
          RC=$?
          set -e
          jq '{actions:(.matrix | length), ecosystems, unresolved:(.gaps | length), gaps: [.gaps[] | {packageId, kind, reason, description}]}' "$RUNNER_TEMP/consumer-quality.json"
          test "$RC" -eq 0
          test "$(jq '.matrix | length' "$RUNNER_TEMP/consumer-quality.json")" -gt 0
          test "$(jq '.gaps | length' "$RUNNER_TEMP/consumer-quality.json")" -eq 0
      - name: Run all applicable consumer quality actions in one job
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/candidate-df/df-linux-x64" ci quality --repo "$GITHUB_WORKSPACE/consumer" --workers 4
