name: Temporary format self-install

on:
  push:
    branches: [feat/darkfactory-control-branch]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/darkfactory-control-branch
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format affected source
        run: |
          bunx biome format --write scripts/fleet-control.mjs scripts/fleet-sync.mjs scripts/fleet-projects.mjs scripts/fleet-control.test.mjs scripts/self-install-check.mjs packages/harness/src/ci/workflow-python.test.ts
      - name: Commit formatter results
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/fleet-control.mjs scripts/fleet-sync.mjs scripts/fleet-projects.mjs scripts/fleet-control.test.mjs scripts/self-install-check.mjs packages/harness/src/ci/workflow-python.test.ts
            git commit -m "style: normalize DarkFactory self-hosted installer"
            git push origin HEAD:feat/darkfactory-control-branch
          fi
