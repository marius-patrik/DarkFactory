# Temporary, intentionally exact-head-only retirement of six reviewed superseded refs.
# Remove this workflow immediately after the successful GitHub Actions run.
name: Retire superseded DarkFactory branches
on:
  push:
    branches: [finish/production-release-2026-10-23]
    paths: [.github/workflows/finish-branch-cleanup.yml]
permissions:
  contents: write
concurrency:
  group: darkfactory-superseded-branch-retirement
  cancel-in-progress: false
jobs:
  retire:
    name: Validate and delete exact superseded refs
    if: ${{ github.repository == 'marius-patrik/DarkFactory' && github.ref == 'refs/heads/finish/production-release-2026-10-23' && github.event.head_commit.message == 'ops(branches): retire six audited superseded refs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify all SHA identities, protections, and open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "marius-patrik/DarkFactory"
          test "$GITHUB_REF" = "refs/heads/finish/production-release-2026-10-23"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq 'length')" = 0
          count=0
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" && "$expected" =~ ^[0-9a-f]{40}$ ]]
            case "$branch" in
              main|finish/production-release-2026-10-23) exit 1 ;;
            esac
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            protected=$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.protected')
            if [ "$actual" != "$expected" ] || [ "$protected" != false ]; then
              echo "::error::Branch head/protection drift: $branch" >&2
              exit 1
            fi
            count=$((count + 1))
          done <<'BRANCHES'
          fix/ci-fail-closed-empty-quality-matrix|f45bffb6b54777cb3a91217751f0c34f4884ec81
          integrate/final-fleet-2026-10-16|a12efc58edfdd19e4b7839872d8c132ab5c3d9dd
          feat/native-tool-config-projections|d7896e2c1655b91f22361e7f122ef0de854e196d
          fix/2070-single-runner-quality|2b6f62bc9e143c06eb4c35f24e24b760365a0ed5
          fix/accept-pkcs1-app-key|3a0a87a29f6f617d483f97958414109972d16f57
          finish/darkfactory|58bb34f50d00287f6bd5164a84434e228aeb0e1f
          BRANCHES
          test "$count" = 6
      - name: Remove only superseded refs whose SHA remains unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch changed during retirement: $branch" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Ref still exists after deletion: $branch" >&2
              exit 1
            fi
            echo "Retired $branch at $expected" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<'BRANCHES'
          fix/ci-fail-closed-empty-quality-matrix|f45bffb6b54777cb3a91217751f0c34f4884ec81
          integrate/final-fleet-2026-10-16|a12efc58edfdd19e4b7839872d8c132ab5c3d9dd
          feat/native-tool-config-projections|d7896e2c1655b91f22361e7f122ef0de854e196d
          fix/2070-single-runner-quality|2b6f62bc9e143c06eb4c35f24e24b760365a0ed5
          fix/accept-pkcs1-app-key|3a0a87a29f6f617d483f97958414109972d16f57
          finish/darkfactory|58bb34f50d00287f6bd5164a84434e228aeb0e1f
          BRANCHES
