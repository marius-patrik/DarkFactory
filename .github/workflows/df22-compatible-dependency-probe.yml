# Read-only compatibility probe: TypeDoc uses minimatch 10 APIs missing from 11.
name: DF22 Compatible Dependency Remediation Probe
on:
  push:
    branches: [agent/2709-candidate-verification-df22]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  compatible-dependency-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Resolve compatible TypeDoc graph without silently approving high advisories
        shell: bash
        run: |
          set -euo pipefail
          jq 'del(.overrides.minimatch)' package.json > package.new.json
          mv package.new.json package.json
          bun install --ignore-scripts
          set +e
          bun audit --json > "$RUNNER_TEMP/audit-full.json"
          all=$?
          bun audit --audit-level=high --json > "$RUNNER_TEMP/audit-high.json"
          high=$?
          set -e
          echo "DF22_FULL_AUDIT_EXIT=$all"
          echo "DF22_HIGH_AUDIT_EXIT=$high"
          cat "$RUNNER_TEMP/audit-full.json"
          test "$high" -eq 0
          for item in package.json bun.lock; do
            echo "DF22_ENCODED_BEGIN:$item"
            base64 -w 0 "$item" | fold -w 400
            echo "DF22_ENCODED_END:$item"
            sha256sum "$item"
          done
