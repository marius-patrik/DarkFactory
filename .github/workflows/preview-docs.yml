name: Validate Documentation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install DarkFactory workspace
        run: bun install --frozen-lockfile

      - name: Validate documentation projections
        run: bun scripts/build-docs.ts --repo-root "$GITHUB_WORKSPACE" --check

      - name: Build documentation
        run: bun scripts/build-docs.ts --repo-root "$GITHUB_WORKSPACE"
