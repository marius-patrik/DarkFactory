name: Validate Documentation and Unified Site Contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install exact workspace
        run: bun install --frozen-lockfile
      - name: Strict documentation graph and reference verification
        run: bun scripts/build-docs.ts --check
      - name: Documentation and artifact security tests
        run: bun test .github/tests/docs
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and formatting
        run: |
          bun run lint
          bun run format:check
      - name: Build nonpublishable docs-only preview
        run: bun scripts/build-docs.ts --docs-only --out "$RUNNER_TEMP/darkfactory-docs-preview"
      - name: Check preview route and graph output
        run: |
          test -s "$RUNNER_TEMP/darkfactory-docs-preview/index.html"
          test -s "$RUNNER_TEMP/darkfactory-docs-preview/content.json"
          test -s "$RUNNER_TEMP/darkfactory-docs-preview/guide-getting-started-installation/index.html"
          test -s "$RUNNER_TEMP/darkfactory-docs-preview/reference-cli/index.html"
      - name: Preserve documentation preview for source review
        uses: actions/upload-artifact@v4
        with:
          name: docs-only-preview-not-for-publication
          path: ${{ runner.temp }}/darkfactory-docs-preview
          include-hidden-files: true
