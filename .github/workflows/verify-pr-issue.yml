name: Verify Bound Issue

on:
  # No `branches` filter: it matches the pull request's *base* ref, and `verify-bound-issue` is a
  # required status context, so scoping it to `develop` left a stacked pull request reporting no run
  # of a required check at all. `edited` is already here because a base-only change invalidates the
  # previous base's results and emits no `synchronize`.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

  # A consumer gets this check from the template in packages/harness/assets/workflows, not by calling
  # this file, so the two carry the same grammar from two owners until that template is converted.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/agent-DarkFactory"

jobs:
  verify-bound-issue:
    runs-on: ubuntu-latest
    steps:
      # The check used to be a `python3 -c` heredoc, which needed nothing but the interpreter this
      # repository is removing. It now runs a file in the tree, so the job needs the tree. Without
      # this step the job runs in an empty workspace and fails with "module not found" on a file
      # that is committed -- which reads like a missing file rather than a missing checkout.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify PR description binds a tracking issue
        # The gate lives with the rest of the pipeline's CI code, so the grammar a required check
        # enforces is testable rather than buried in a heredoc inside this file.
        run: bun packages/harness/src/ci/bound-issue.ts
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
