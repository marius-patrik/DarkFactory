name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

jobs:
  verify-bound-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description binds a tracking issue
        run: |
          python3 -c '
          import re, sys, os

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name != "pull_request":
              print(f"Skipping check for non-pull_request event: {event_name}")
              sys.exit(0)

          body = os.environ.get("PR_BODY", "")
          pattern = r"(?i)\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+(?:#\d+|https://github\.com/[^/\s]+/[^/\s]+/issues/\d+)\b"

          matches = re.findall(pattern, body)
          if not matches:
              print("❌ ERROR: Every pull request must bind a tracking issue using closing syntax in the description.", file=sys.stderr)
              print("   Examples: Closes #123, Fixes #123, Resolves #123", file=sys.stderr)
              print("   This ensures the issue is automatically closed when the PR merges.", file=sys.stderr)
              sys.exit(1)

          print(f"✅ Bound issue syntax verified: {matches}")
          '
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
