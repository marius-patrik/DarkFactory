name: DF-16 Nonpublishing Release Governance
on:
  push:
    branches: [agent/2708-release-gate-df16]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: df16-release-verification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    name: DF-16 release policy verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - name: Emit formatter-corrected source for exact-tree repair
        if: always()
        run: |
          bun node_modules/.bin/biome format --write \
            packages/harness/src/release/versioning.ts \
            packages/harness/src/release/promotion-evidence.ts \
            packages/harness/src/release/promotion-preflight.ts \
            packages/harness/src/release/promotion-assets.ts \
            .github/tests/release/promotion-evidence.test.ts \
            .github/tests/release/version-transitions.test.ts
          for path in packages/harness/src/release/versioning.ts packages/harness/src/release/promotion-evidence.ts packages/harness/src/release/promotion-preflight.ts packages/harness/src/release/promotion-assets.ts .github/tests/release/promotion-evidence.test.ts .github/tests/release/version-transitions.test.ts; do
            printf 'DF16_FILE:%s:%s\n' "$path" "$(base64 -w0 "$path")"
          done
      - run: bun run lint
      - run: bun test .github/tests/release
      - run: bun run test
