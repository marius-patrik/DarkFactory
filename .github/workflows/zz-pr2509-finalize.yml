name: One-time PR #2509 refactor finalizer
on:
  push:
    branches: [fix/ci-fail-closed-empty-quality-matrix]
    paths: [.github/workflows/zz-pr2509-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'marius-patrik/DarkFactory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-fail-closed-empty-quality-matrix
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Reconcile moved imports and format tracked source
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path').posix,{execFileSync}=require('node:child_process');
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean),set=new Set(files);
          function original(p){if(p.startsWith('.github/tests/harness/scripts/'))return 'packages/harness/scripts/'+p.slice(30);if(p.startsWith('.github/tests/darkfactory/'))return '.darkfactory/'+p.slice(26);if(p.startsWith('.github/tests/scripts/'))return 'scripts/'+p.slice(22);if(p.startsWith('.github/tests/')){const a=p.split('/');return a.length===3?'tests/'+a[2]:'packages/'+a[2]+'/test/'+a.slice(3).join('/')}if(p.startsWith('packages/github/src/approvals/'))return 'packages/harness/src/approvals/'+p.slice(30);if(p.startsWith('packages/github/src/ci/'))return 'packages/harness/src/ci/'+p.slice(23);if(p.startsWith('packages/github/src/')&&p!=='packages/github/src/types.ts')return 'packages/harness/src/github/'+p.slice(20);return p}
          const orig=new Map(files.map(f=>[original(f),f])),candidates=s=>[s,s+'.ts',s+'.tsx',s+'.js',s+'.mjs',s+'.json',s+'/index.ts',s+'/index.tsx'],existing=s=>candidates(s).find(f=>set.has(f)),oldExisting=s=>candidates(s).find(f=>orig.has(f));
          let edits=0,rewrites=0;const unresolved=[];
          for(const f of files){if(!/\.(ts|tsx|js|mjs|cjs|json|yml|yaml|md|sh)$/.test(f))continue;let str=fs.readFileSync(f,'utf8'),out=str;
          if(/\.(ts|tsx|js|mjs|cjs)$/.test(f)){const fromOld=original(f);out=out.replace(/(["'])(\.{1,2}\/[^"'\n]+)\1/g,(matched,q,spec)=>{if(existing(path.normalize(path.join(path.dirname(f),spec))))return matched;const match=oldExisting(path.normalize(path.join(path.dirname(fromOld),spec)));if(!match){if(/\.(ts|tsx|js|mjs)$/.test(spec)&&unresolved.length<100)unresolved.push([f,spec]);return matched;}const dest=orig.get(match);let replacement=path.relative(path.dirname(f),dest);if(!replacement.startsWith('.'))replacement='./'+replacement;if(!/\.[a-z\d]+$/i.test(spec))replacement=replacement.replace(/\.[a-z\d]+$/i,'');if(replacement!==spec){rewrites++;return q+replacement+q}return matched;});}
          out=out.replace(/packages\/harness\/src\/github\//g,'packages/github/src/').replace(/packages\/harness\/src\/approvals\//g,'packages/github/src/approvals/').replace(/packages\/harness\/src\/ci\/(?!detected\.ts)/g,'packages/github/src/ci/');out=out.replace(/packages\/([\w-]+)\/test\//g,(_m,pkg)=>'.github/tests/'+pkg+'/');out=out.replace(/packages\/harness\/scripts\/((?:release-targets|release-workflow)\.test\.ts)/g,(_m,name)=>'.github/tests/harness/scripts/'+name);
          if(out!==str){fs.writeFileSync(f,out);edits++;}}
          console.log(JSON.stringify({edits,rewrites,unresolved:unresolved.slice(0,35)}));
          NODE
          bunx biome format --write .
          git status --short | head -30
      - name: Commit formatting to existing PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "fix(refactor): reconcile moved paths and normalize formatting"
            git push origin HEAD:fix/ci-fail-closed-empty-quality-matrix
          fi
