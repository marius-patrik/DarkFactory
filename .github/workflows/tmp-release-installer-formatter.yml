name: Temporary Source-Free Release Formatter
on:
  push:
    branches: [feat/released-df-installer-1166]
permissions:
  contents: write
concurrency:
  group: temp-release-installer-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/released-df-installer-1166
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: bunx biome format --write packages/harness/scripts/package-assets.ts packages/harness/scripts/verify-target.ts packages/harness/src/ci/detected.ts packages/harness/src/install/released-df.ts packages/harness/test/install/released-df.test.ts packages/harness/src/cli.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/harness/scripts/package-assets.ts packages/harness/scripts/verify-target.ts packages/harness/src/ci/detected.ts packages/harness/src/install/released-df.ts packages/harness/test/install/released-df.test.ts packages/harness/src/cli.ts
          git commit -m 'style(release): format source-free installer and full bundles'
          git push origin HEAD:feat/released-df-installer-1166
