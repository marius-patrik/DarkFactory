name: DF-17 Formatter Readback
on:
  pull_request:
    types: [synchronize, opened, reopened]
  workflow_call:
permissions:
  contents: read
jobs:
  formatter:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/2709-source-free-candidate-df17'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Format owned files and emit a byte-exact readback, without committing
        shell: bash
        run: |
          set -euo pipefail
          bunx biome format --write packages/harness/scripts/candidate-evidence.ts packages/harness/scripts/candidate-npm.ts packages/harness/scripts/verify-target.ts
          for p in packages/harness/scripts/candidate-evidence.ts packages/harness/scripts/candidate-npm.ts packages/harness/scripts/verify-target.ts; do
            echo "DF17_FORMAT_START::$p"
            base64 -w0 "$p"
            echo
            echo "DF17_FORMAT_END::$p"
          done
