name: Temporary Format Installer Files
on:
  push:
    branches: [feat/released-df-installer-1166]
permissions:
  contents: write
concurrency:
  group: installer-format
  cancel-in-progress: false
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/released-df-installer-1166
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format added installer code
        run: bunx biome format --write packages/harness/src/install/released-df.ts packages/harness/test/install/released-df.test.ts packages/harness/src/cli.ts
      - name: Commit formatter result
        run: |
          if git diff --quiet -- packages/harness/src/install/released-df.ts packages/harness/test/install/released-df.test.ts packages/harness/src/cli.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/harness/src/install/released-df.ts packages/harness/test/install/released-df.test.ts packages/harness/src/cli.ts
          git commit -m 'style(cli): biome format source-free installer'
          git push origin HEAD:feat/released-df-installer-1166
