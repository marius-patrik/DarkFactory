name: Open Pull Request

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Head branch name (e.g. feature/my-feature)'
        required: true
        type: string
      title:
        description: 'Pull Request title'
        required: true
        type: string
      body:
        description: 'Pull Request description'
        required: true
        type: string
      base:
        description: 'Target base branch'
        required: false
        default: 'main'
        type: string
      draft:
        description: 'Create as draft PR'
        required: false
        default: true
        type: boolean

  # Consumers call this rather than copying it, so the scripts it runs live in one place.
  workflow_call:
    inputs:
      # The dispatch inputs are repeated here because a called workflow receives nothing from the
      # caller's own `inputs` context automatically; a caller must forward each one by name.
      branch:
        description: 'Head branch name (e.g. feature/my-feature)'
        required: true
        type: string
      title:
        description: 'Pull Request title'
        required: true
        type: string
      body:
        description: 'Pull Request description'
        required: true
        type: string
      base:
        description: 'Target base branch'
        required: false
        default: 'main'
        type: string
      draft:
        description: 'Create as draft PR'
        required: false
        default: true
        type: boolean
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
    secrets:
      DARKFACTORY_APP_PRIVATE_KEY: {required: false}
      GH_PROJECT_TOKEN: {required: false}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read from a step-level `if`, so the test is hoisted to the
      # job, where it can.
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the App
        # Issue and pull request work belongs to the App, which has its own rate limit. Rate limits
        # are per *user*, shared across every token a person holds, so a busy session used to
        # exhaust the pipeline's quota along with the person's. Only Projects v2 still needs a
        # person's token, because GitHub scopes project permissions to organisations and these
        # boards are user-owned.
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}

      - name: Create or Update Pull Request as GitHub Actions Bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          BASE: ${{ inputs.base }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists for $BRANCH. Updating title and body..."
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body "$BODY"
            exit 0
          fi

          DRAFT_ARG=""
          if [ "$IS_DRAFT" = "true" ] || [ "$IS_DRAFT" = "True" ]; then
            DRAFT_ARG="--draft"
          fi

          echo "Creating PR for $BRANCH -> $BASE with draft=$DRAFT_ARG..."
          gh pr create \
            --head "$BRANCH" \
            --base "$BASE" \
            --title "$TITLE" \
            --body "$BODY" \
            $DRAFT_ARG
