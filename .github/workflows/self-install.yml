name: Verify DarkFactory Self-Installation

on:
  pull_request:
    paths:
      - "repo.dfconfig"
      - ".darkfactory/installation.json"
      - ".github/workflows/darkfactory-control.yml"
      - ".github/workflows/darkfactory-self.yml"
      - "scripts/fleet-control.mjs"
      - "scripts/fleet-sync.mjs"
      - "scripts/self-install-check.mjs"
      - ".github/workflows/self-install.yml"
      - ".github/workflows/project-automation.yml"
      - ".github/workflows/fleet-updates.yml"
      - ".github/workflows/verify-pr-issue.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  self-install:
    name: self-install
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DarkFactory source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source-owned installation on main
        run: node scripts/self-install-check.mjs .
      - name: Retire merged control branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/darkfactory" --jq ".object.sha" 2>/dev/null || true)
          if [ -n "$branch_sha" ]; then
            git cat-file -e "$branch_sha^{commit}" || git fetch origin "$branch_sha"
            git merge-base --is-ancestor "$branch_sha" HEAD || { echo "Refusing to remove an unmerged control branch" >&2; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/darkfactory"
          fi
