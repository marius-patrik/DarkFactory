name: Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [agent-dispatch]
  workflow_dispatch:
    inputs:
      target-repo:
        description: "Target repository to run against"
        required: false
        type: string
        default: ""
      event-name:
        description: "Event name"
        required: false
        type: string
        default: ""
  # Consumers call this rather than copying the runner. Secrets do not cross a workflow_call
  # boundary on their own - a called workflow sees the caller's secrets only when they are passed -
  # so every credential the agent can use is declared here and marked optional. A repository that
  # has three of the twelve gets a shorter fallback chain, not a failure.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the runner and the container definition."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
      agent-enabled:
        description: "Whether the agent should run. Mirrors the AGENT_ENABLED repository variable."
        required: false
        type: string
        default: ""
    secrets:
    # Generated from the harness registry - `harnesses.credential_env_names()` - and asserted
    # against it by a test. A workflow that omits a credential does not fail; it silently
    # shortens the fallback chain. The numbered names are further accounts of the same
    # provider: holding a second is how an exhausted quota is answered without waiting, and
    # adding one is adding a secret.
      DARKFACTORY_APP_PRIVATE_KEY: {required: false}
      GH_PROJECT_TOKEN: {required: false}
      ANTIGRAVITY_REFRESH_TOKEN: {required: false}
      ANTIGRAVITY_CLIENT_ID: {required: false}
      ANTIGRAVITY_CLIENT_SECRET: {required: false}
      ANTIGRAVITY_REFRESH_TOKEN_2: {required: false}
      ANTIGRAVITY_CLIENT_ID_2: {required: false}
      ANTIGRAVITY_CLIENT_SECRET_2: {required: false}
      ANTIGRAVITY_REFRESH_TOKEN_3: {required: false}
      ANTIGRAVITY_CLIENT_ID_3: {required: false}
      ANTIGRAVITY_CLIENT_SECRET_3: {required: false}
      CLAUDE_CODE_OAUTH_TOKEN: {required: false}
      ANTHROPIC_API_KEY: {required: false}
      CLAUDE_CODE_OAUTH_TOKEN_2: {required: false}
      ANTHROPIC_API_KEY_2: {required: false}
      CLAUDE_CODE_OAUTH_TOKEN_3: {required: false}
      ANTHROPIC_API_KEY_3: {required: false}
      OPENAI_API_KEY: {required: false}
      OPENAI_API_KEY_2: {required: false}
      OPENAI_API_KEY_3: {required: false}
      MOONSHOT_API_KEY: {required: false}
      KIMI_API_KEY: {required: false}
      MOONSHOT_API_KEY_2: {required: false}
      KIMI_API_KEY_2: {required: false}
      MOONSHOT_API_KEY_3: {required: false}
      KIMI_API_KEY_3: {required: false}
      XAI_API_KEY: {required: false}
      GROK_API_KEY: {required: false}
      XAI_API_KEY_2: {required: false}
      GROK_API_KEY_2: {required: false}
      XAI_API_KEY_3: {required: false}
      GROK_API_KEY_3: {required: false}
      CURSOR_API_KEY: {required: false}
      CURSOR_API_KEY_2: {required: false}
      CURSOR_API_KEY_3: {required: false}
      OPENCODE_API_KEY: {required: false}
      OPENCODE_API_KEY_2: {required: false}
      OPENCODE_API_KEY_3: {required: false}
permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  run-agent:
    # The agent stays off until at least one harness has credentials. Set the repository variable
    # AGENT_ENABLED to "true" once a harness secret is configured; until then every issue would
    # otherwise start a container build that cannot authenticate. `secrets` is not available in a
    # job-level `if`, which is why this gate is a variable and the runner re-checks at dispatch.
    if: vars.AGENT_ENABLED == 'true' || inputs.agent-enabled == 'true'
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be read from a step-level `if`, so the test
      # is hoisted to the job, where it can.
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the App
        # Repository work - reading an issue, commenting, opening a pull request - is what the App
        # is installed for, and an installation has its own rate limit. Doing it with a person's
        # token spends a quota shared with everything else that person runs, which is how the agent
        # came to fail on `gh issue view` while a human was working in the same account.
        #
        # Projects v2 is the exception: GitHub scopes project permissions to organisations, so a
        # user-owned board still needs GH_PROJECT_TOKEN. That is the only thing that does.
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}

      - name: Delegate to Central DarkFactory
        id: delegate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PIPELINE="${{ inputs.pipeline-repo || 'marius-patrik/DarkFactory' }}"
          if [ "${{ github.repository }}" != "$PIPELINE" ]; then
            echo "Delegating agent run from ${{ github.repository }} to central pipeline in $PIPELINE..."
            gh api "repos/$PIPELINE/dispatches" \
              -f event_type="agent-dispatch" \
              -F client_payload[repository]="${{ github.repository }}" \
              -F client_payload[event_name]="${{ github.event_name }}" \
              -F client_payload[payload]=@$GITHUB_EVENT_PATH
            echo "delegated=true" >> "$GITHUB_OUTPUT"
          else
            echo "delegated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve target environment
        id: target-env
        if: steps.delegate.outputs.delegated != 'true'
        run: |
          TARGET_REPO="${{ github.event.client_payload.repository || inputs.target-repo || github.repository }}"
          EVENT_NAME="${{ github.event.client_payload.event_name || inputs.event-name || github.event_name }}"
          OWNER="${TARGET_REPO%%/*}"

          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -n "${{ github.event.client_payload.payload }}" ]; then
            cat << 'EOF' > /tmp/event.json
          ${{ toJson(github.event.client_payload.payload) }}
          EOF
            EVENT_PATH="/tmp/event.json"
          else
            EVENT_PATH="${{ github.event_path }}"
          fi

          echo "repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "event_name=$EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "event_path=$EVENT_PATH" >> "$GITHUB_OUTPUT"
          echo "is_external=$([ "$TARGET_REPO" != "${{ github.repository }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # Checked out with the App's token, so the branches the agent pushes are pushed by the App
        # and the checks on them run. A push made with GITHUB_TOKEN triggers no workflow at all,
        # which is why a person's token was reached for here in the first place.
        if: steps.delegate.outputs.delegated != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target-env.outputs.repo }}
          token: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check out the pinned pipeline
        if: steps.delegate.outputs.delegated != 'true' && (inputs.pipeline-ref != '' || steps.target-env.outputs.is_external == 'true')
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo || 'marius-patrik/DarkFactory' }}
          ref: ${{ inputs.pipeline-ref || 'darkfactory' }}
          path: .darkfactory

      - name: Build agent container
        # The image is built from the pipeline's definition, so every consumer runs the same
        # runner; the repository being worked on is still the caller's checkout, mounted below.
        if: steps.delegate.outputs.delegated != 'true'
        run: |
          CONTEXT="."
          [ -d .darkfactory ] && CONTEXT=".darkfactory"
          docker build -t darkfactory-agent -f "$CONTEXT/docker/Dockerfile.agent" "$CONTEXT"

      - name: Dispatch agent in container
        if: steps.delegate.outputs.delegated != 'true'
        run: |
          docker run --rm \
            -e AGENT_HARNESS_CHAIN="${{ vars.AGENT_HARNESS_CHAIN }}" \
            -e AGENT_HARNESS_CONFIG="${{ vars.AGENT_HARNESS_CONFIG }}" \
            -e AGENT_MODEL_CHAIN="${{ vars.AGENT_MODEL_CHAIN }}" \
            -e ANTIGRAVITY_REFRESH_TOKEN="${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}" \
            -e ANTIGRAVITY_CLIENT_ID="${{ secrets.ANTIGRAVITY_CLIENT_ID }}" \
            -e ANTIGRAVITY_CLIENT_SECRET="${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}" \
            -e ANTIGRAVITY_REFRESH_TOKEN_2="${{ secrets.ANTIGRAVITY_REFRESH_TOKEN_2 }}" \
            -e ANTIGRAVITY_CLIENT_ID_2="${{ secrets.ANTIGRAVITY_CLIENT_ID_2 }}" \
            -e ANTIGRAVITY_CLIENT_SECRET_2="${{ secrets.ANTIGRAVITY_CLIENT_SECRET_2 }}" \
            -e ANTIGRAVITY_REFRESH_TOKEN_3="${{ secrets.ANTIGRAVITY_REFRESH_TOKEN_3 }}" \
            -e ANTIGRAVITY_CLIENT_ID_3="${{ secrets.ANTIGRAVITY_CLIENT_ID_3 }}" \
            -e ANTIGRAVITY_CLIENT_SECRET_3="${{ secrets.ANTIGRAVITY_CLIENT_SECRET_3 }}" \
            -e ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            -e CLAUDE_CODE_OAUTH_TOKEN="${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" \
            -e ANTHROPIC_API_KEY_2="${{ secrets.ANTHROPIC_API_KEY_2 }}" \
            -e CLAUDE_CODE_OAUTH_TOKEN_2="${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}" \
            -e ANTHROPIC_API_KEY_3="${{ secrets.ANTHROPIC_API_KEY_3 }}" \
            -e CLAUDE_CODE_OAUTH_TOKEN_3="${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}" \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e OPENAI_API_KEY_2="${{ secrets.OPENAI_API_KEY_2 }}" \
            -e OPENAI_API_KEY_3="${{ secrets.OPENAI_API_KEY_3 }}" \
            -e MOONSHOT_API_KEY="${{ secrets.MOONSHOT_API_KEY }}" \
            -e KIMI_API_KEY="${{ secrets.KIMI_API_KEY }}" \
            -e MOONSHOT_API_KEY_2="${{ secrets.MOONSHOT_API_KEY_2 }}" \
            -e KIMI_API_KEY_2="${{ secrets.KIMI_API_KEY_2 }}" \
            -e MOONSHOT_API_KEY_3="${{ secrets.MOONSHOT_API_KEY_3 }}" \
            -e KIMI_API_KEY_3="${{ secrets.KIMI_API_KEY_3 }}" \
            -e XAI_API_KEY="${{ secrets.XAI_API_KEY }}" \
            -e GROK_API_KEY="${{ secrets.GROK_API_KEY }}" \
            -e XAI_API_KEY_2="${{ secrets.XAI_API_KEY_2 }}" \
            -e GROK_API_KEY_2="${{ secrets.GROK_API_KEY_2 }}" \
            -e XAI_API_KEY_3="${{ secrets.XAI_API_KEY_3 }}" \
            -e GROK_API_KEY_3="${{ secrets.GROK_API_KEY_3 }}" \
            -e CURSOR_API_KEY="${{ secrets.CURSOR_API_KEY }}" \
            -e CURSOR_API_KEY_2="${{ secrets.CURSOR_API_KEY_2 }}" \
            -e CURSOR_API_KEY_3="${{ secrets.CURSOR_API_KEY_3 }}" \
            -e OPENCODE_API_KEY="${{ secrets.OPENCODE_API_KEY }}" \
            -e OPENCODE_API_KEY_2="${{ secrets.OPENCODE_API_KEY_2 }}" \
            -e OPENCODE_API_KEY_3="${{ secrets.OPENCODE_API_KEY_3 }}" \
            -e GH_TOKEN="${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}" \
            -e GH_PROJECT_TOKEN="${{ secrets.GH_PROJECT_TOKEN }}" \
            -e GITHUB_EVENT_PATH="/workspace/event.json" \
            -e GITHUB_EVENT_NAME="${{ steps.target-env.outputs.event_name }}" \
            -e GITHUB_REPOSITORY="${{ steps.target-env.outputs.repo }}" \
            -e GITHUB_REPOSITORY_OWNER="${{ steps.target-env.outputs.owner }}" \
            -e PROJECT_NUMBER="${{ vars.PROJECT_NUMBER }}" \
            -v "${{ steps.target-env.outputs.event_path }}:/workspace/event.json:ro" \
            -v "${{ github.workspace }}:/workspace" \
            darkfactory-agent dispatch
