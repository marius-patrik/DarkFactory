name: Autonomous Agent

on:
  issues:
    # `labeled` is what lets the pipeline be started on an issue that already exists. Without it a
    # failure report filed by report-failure.yml - and any issue a human opened before this trigger
    # existed - can never enter the graph, because the only entry edge carries the `Request` label.
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [agent-dispatch]
  workflow_dispatch:
    inputs:
      target-repo:
        description: "Target repository to run against"
        required: false
        type: string
        default: ""
      event-name:
        description: "Event name"
        required: false
        type: string
        default: ""
  # Consumers call this rather than copying the runner. Secrets do not cross a workflow_call
  # boundary on their own - a called workflow sees the caller's secrets only when they are passed -
  # so every credential the agent can use is declared here and marked optional. A repository that
  # has three of the twelve gets a shorter fallback chain, not a failure.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the runner and the container definition."
        required: false
        type: string
        default: "marius-patrik/agent-DarkFactory"
      agent-enabled:
        description: "Whether the agent should run. Mirrors the AGENT_ENABLED repository variable."
        required: false
        type: string
        default: ""
    secrets:
    # Generated from the df container setup - `agent_runner.df_setup_secret_names()` - and asserted
    # against it by a test. The pipeline runs df as its only agent harness, so only the secrets df's
    # setup consumes are declared: API keys saved with `df account set` and subscription account records
    # loaded with `df account load`. A workflow that omits one does not fail; df runs with a
    # shorter chain. The harness chain itself is fixed to df: AGENT_HARNESS_CHAIN and
    # AGENT_HARNESS_CONFIG are deliberately not forwarded, so the removed external CLIs cannot be
    # re-enabled in DarkFactory's own workflows.
      DARKFACTORY_APP_PRIVATE_KEY: {required: false}
      GH_PROJECT_TOKEN: {required: false}
      GEMINI_API_KEY: {required: false}
      GEMINI_API_KEY_2: {required: false}
      GEMINI_API_KEY_3: {required: false}
      OPENROUTER_API_KEY: {required: false}
      OPENROUTER_API_KEY_2: {required: false}
      GROQ_API_KEY: {required: false}
      DF_ACCOUNT_OPENAI_CODEX: {required: false}
      DF_ACCOUNT_GROK_SUB: {required: false}
permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  run-agent:
    # The agent stays off until at least one harness has credentials. Set the repository variable
    # AGENT_ENABLED to "true" once a harness secret is configured; until then every issue would
    # otherwise start a container build that cannot authenticate. `secrets` is not available in a
    # job-level `if`, which is why this gate is a variable and the runner re-checks at dispatch.
    #
    # Comments written by a bot (the agent's own Interpretation, plan and review comments, board
    # automation) are skipped here rather than inside the container: the runner ignores them anyway,
    # and reaching that check cost a container build and two OAuth refreshes per comment.
    #
    # `Failed again:` is the exception, and it is a narrow one. The failure reporter posts it on the
    # already-open failure issue when a red build recurs after a repair, so it is the only signal
    # that resumes a muted loop; it is recognised by shape because its author is the pipeline itself.
    #
    # A `pipeline-failure` issue is deliberately NOT skipped. It used to be, which muted the whole
    # loop: report-failure.yml files exactly that issue when a red build needs attention, and the
    # guard then refused to act on it, so every failure was reported and ignored forever. The label
    # stays for board and triage purposes; the loop is bounded by the deterministic effect identity
    # the runner claims in agent_runner.py (`claim_failure_dispatch`), not by a label test.
    if: (vars.AGENT_ENABLED == 'true' || inputs.agent-enabled == 'true') && (!endsWith(github.event.comment.user.login, '[bot]') || startsWith(github.event.comment.body, 'Failed again:'))
    runs-on: ubuntu-latest
    # The pipeline's own failure reports are not work. `report-failure.yml` fires on
    # `workflow_run: completed` and opens a `pipeline-failure`-labelled issue whenever a workflow
    # fails. This job triggers on `issues: [opened]` with no label filter, so it started on each of
    # those; it then failed on every run (no `setup-bun` step — see below), which produced another
    # failure report, which woke it again. 100 consecutive Autonomous Agent failures and a
    # 1,411-run Actions backlog came from this alone.
    #
    # The graph's entry edge requires the `Request` label, but the workflow is dispatched before the
    # graph is consulted, so nothing downstream could decline the run. Gating here is what stops it.
    # A human opening an issue, or labelling any issue `Request`, is unaffected.
    # Kept the existing clauses intact: the agent stays opt-in via `AGENT_ENABLED`, and bot comments
    # are still declined except for the pipeline's own `Failed again:` ones, which it wants to see so
    # a recovered workflow closes its issue.
    #
    # Added: `issues: [opened]` has no label filter, so this job started on *every* opened issue —
    # including each `pipeline-failure` issue `report-failure.yml` opens when a workflow fails. The
    # graph's entry edge requires the `Request` label, but the workflow is dispatched before the
    # graph is consulted, so nothing downstream could decline the run. Combined with the job failing
    # on every run (no `setup-bun` step — below), that was self-sustaining: 100 consecutive Autonomous
    # Agent failures and a 1,411-run Actions backlog.
    if: >-
      (vars.AGENT_ENABLED == 'true' || inputs.agent-enabled == 'true')
      && (!endsWith(github.event.comment.user.login, '[bot]') || startsWith(github.event.comment.body, 'Failed again:'))
      && (github.event_name != 'issues'
          || github.event.issue.labels == null
          || !contains(github.event.issue.labels.*.name, 'pipeline-failure'))
    env:
      # The secrets context cannot be read from a step-level `if`, so the test
      # is hoisted to the job, where it can.
      HAS_APP_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint an installation token for the App
        # Repository work - reading an issue, commenting, opening a pull request - is what the App
        # is installed for, and an installation has its own rate limit. Doing it with a person's
        # token spends a quota shared with everything else that person runs, which is how the agent
        # came to fail on `gh issue view` while a human was working in the same account.
        #
        # Projects v2 is the exception: GitHub scopes project permissions to organisations, so a
        # user-owned board still needs GH_PROJECT_TOKEN. That is the only thing that does.
        id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v1
        continue-on-error: true
        with:
          app-id: ${{ vars.DARKFACTORY_APP_ID || '4861004' }}
          private-key: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Delegate to Central DarkFactory
        id: delegate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PIPELINE="${{ inputs.pipeline-repo || 'marius-patrik/agent-DarkFactory' }}"
          if [ "${{ github.repository }}" != "$PIPELINE" ]; then
            echo "Delegating agent run from ${{ github.repository }} to central pipeline in $PIPELINE..."
            gh api "repos/$PIPELINE/dispatches" \
              -f event_type="agent-dispatch" \
              -F client_payload[repository]="${{ github.repository }}" \
              -F client_payload[event_name]="${{ github.event_name }}" \
              -F client_payload[payload]=@$GITHUB_EVENT_PATH
            echo "delegated=true" >> "$GITHUB_OUTPUT"
          else
            echo "delegated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        # `Resolve target environment` below runs `bun -e` on the host, before the agent container
        # exists. The job had no `setup-bun` step at all, so that step died at
        # `bun: command not found` (exit 127) on every run. Because this workflow triggers on
        # `issues: [opened, labeled]`, and `report-failure.yml` opens a labelled issue every time
        # any workflow fails, that made it a fixed point of its own failure: agent fails -> report
        # opens an issue -> agent runs on it -> fails -> report opens another. 100 consecutive
        # Autonomous Agent failures, and a 1,411-run Actions backlog.
        #
        # The container (step "Dispatch agent in container") has its own Bun; this is only about
        # the host-side step that precedes it.
        uses: oven-sh/setup-bun@v2

      - name: Resolve target environment
        id: target-env
        if: steps.delegate.outputs.delegated != 'true'
        env:
          INPUT_TARGET_REPO: ${{ inputs.target-repo }}
          INPUT_EVENT_NAME: ${{ inputs.event-name }}
        run: |
          # Unwraps a re-dispatched event: a dispatch that carries its own `client_payload.payload`
          # has the real event one level down, and the runner has to be handed that rather than the
          # wrapper. An inner payload that is a string is parsed when it parses and kept verbatim
          # when it does not, because a non-JSON payload is still the payload.
          bun -e '
          import { appendFileSync, writeFileSync } from "node:fs";
          const event = await Bun.file(process.env.GITHUB_EVENT_PATH).json();
          const payload = (event && typeof event === "object" ? event.client_payload : null) ?? {};
          const targetRepo =
            payload.repository ||
            process.env.INPUT_TARGET_REPO ||
            process.env.GITHUB_REPOSITORY ||
            "";
          const eventName =
            payload.event_name ||
            process.env.INPUT_EVENT_NAME ||
            process.env.GITHUB_EVENT_NAME ||
            "";
          const owner = targetRepo ? targetRepo.split("/")[0] : "";
          let eventPath = process.env.GITHUB_EVENT_PATH;
          if (event?.action === "agent-dispatch" || "client_payload" in (event ?? {})) {
            const inner = payload.payload;
            if (inner) {
              let value = inner;
              if (typeof value === "string") {
                try { value = JSON.parse(value); } catch { /* kept verbatim */ }
              }
              const serialised =
                value !== null && typeof value === "object" ? JSON.stringify(value) : String(value);
              writeFileSync("/tmp/event.json", serialised);
              eventPath = "/tmp/event.json";
            }
          }
          const isExternal = targetRepo !== process.env.GITHUB_REPOSITORY;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `repo=${targetRepo}`,
              `owner=${owner}`,
              `event_name=${eventName}`,
              `event_path=${eventPath}`,
              `is_external=${isExternal}`,
              "",
            ].join("\n"),
          );
          ' >> /dev/null

      - name: Checkout repository
        # Checked out with the App's token, so the branches the agent pushes are pushed by the App
        # and the checks on them run. A push made with GITHUB_TOKEN triggers no workflow at all,
        # which is why a person's token was reached for here in the first place.
        #
        # `fetch-depth: 0` is required, not a preference. The runner diffs the branch against its
        # base to decide what is out of plan scope, and the default shallow checkout contains one
        # commit and no other refs, so every `origin/<base>` it tried was unresolvable. The diff
        # then returned nothing and the scope gate passed on an empty file list.
        if: steps.delegate.outputs.delegated != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.target-env.outputs.repo }}
          token: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check out the pinned pipeline
        if: steps.delegate.outputs.delegated != 'true' && (inputs.pipeline-ref != '' || steps.target-env.outputs.is_external == 'true')
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo || 'marius-patrik/agent-DarkFactory' }}
          # `main` is the pipeline repository's default branch. The previous `darkfactory` default
          # names a branch that no longer exists, so this checkout failed and the agent container
          # was never built for an external run.
          ref: ${{ inputs.pipeline-ref || 'main' }}
          path: .darkfactory-pipeline

      - name: Build agent container
        # The image is built from the pipeline's definition, so every consumer runs the same
        # runner; the repository being worked on is still the caller's checkout, mounted below.
        if: steps.delegate.outputs.delegated != 'true'
        run: |
          CONTEXT="."
          [ -d .darkfactory-pipeline ] && CONTEXT=".darkfactory-pipeline"
          docker build -t darkfactory-agent -f "$CONTEXT/docker/Dockerfile.agent" "$CONTEXT"

      - name: Dispatch agent in container
        if: steps.delegate.outputs.delegated != 'true'
        # Values reach the container through the step environment and `-e NAME`, never through the
        # script text: an expression is pasted into the shell before it runs, so a login file's JSON
        # lost its quotes on the way in, and a `$(...)` inside any value would have been executed.
        env:
          AGENT_MODEL_CHAIN: ${{ vars.AGENT_MODEL_CHAIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DF_ACCOUNT_OPENAI_CODEX: ${{ secrets.DF_ACCOUNT_OPENAI_CODEX }}
          DF_ACCOUNT_GROK_SUB: ${{ secrets.DF_ACCOUNT_GROK_SUB }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          cp "${{ steps.target-env.outputs.event_path }}" "${{ github.workspace }}/event.json"
          docker run --rm \
            -e AGENT_MODEL_CHAIN \
            -e GEMINI_API_KEY \
            -e GEMINI_API_KEY_2 \
            -e GEMINI_API_KEY_3 \
            -e OPENROUTER_API_KEY \
            -e OPENROUTER_API_KEY_2 \
            -e GROQ_API_KEY \
            -e DF_ACCOUNT_OPENAI_CODEX \
            -e DF_ACCOUNT_GROK_SUB \
            -e GH_TOKEN \
            -e GH_PROJECT_TOKEN \
            -e GITHUB_EVENT_PATH="/workspace/event.json" \
            -e GITHUB_EVENT_NAME="${{ steps.target-env.outputs.event_name }}" \
            -e GITHUB_REPOSITORY="${{ steps.target-env.outputs.repo }}" \
            -e GITHUB_REPOSITORY_OWNER="${{ steps.target-env.outputs.owner }}" \
            -e PROJECT_NUMBER \
            -v "${{ github.workspace }}:/workspace" \
            darkfactory-agent dispatch

