name: Release

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      bump:
        description: "Explicit bump: patch, minor, major, proud (pridever only), or an exact version"
        required: false
        type: string
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"
  workflow_dispatch:
    inputs:
      bump:
        description: "Explicit bump: patch, minor, major, proud (pridever only), or an exact version"
        required: false
        type: string

# The version comes from `scripts/versioning.ts`, the TypeScript replacement for
# `.github/scripts/versioning.py`, and the `df` build matrix comes from
# `packages/harness/scripts/release-targets.ts`. Adding a published platform is therefore a change to
# table, not to this file, and there is one place where the two agree on what is being released.
#
# Every action is pinned to a full commit id. A floating `@v4` is a tag whoever controls the action
# can repoint at new code, which in a job holding `contents: write` is a supply-chain hole rather
# than a convenience. The version each pin names is in the trailing comment.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      warranted: ${{ steps.version.outputs.warranted }}
      matrix: ${{ steps.targets.outputs.matrix }}
      has-assets: ${{ steps.assets.outputs.has }}
    steps:
      - name: Checkout repository
        # Tags decide the current version, so a shallow clone would compute the wrong next one.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .darkfactory-pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .darkfactory-pipeline/.github/scripts ]; then
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.darkfactory-pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Resolve the next release version
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        run: |
          bun scripts/versioning.ts --repo-root . > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"
          # An empty `next` means nothing is release-worthy, which is a clean no-op rather than a
          # failure, and every job that would publish is gated on it.
          jq -r '"version=\(.next // "")", "tag=\(.tag // "")", "warranted=\(if .next then "true" else "false" end)"' \
            "$RUNNER_TEMP/version.json" >> "$GITHUB_OUTPUT"

      - name: Derive the df build matrix
        id: targets
        run: |
          bun packages/harness/scripts/release-targets.ts > "$RUNNER_TEMP/matrix.json"
          cat "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(jq -c . "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

      - name: Report that no release is warranted
        if: steps.version.outputs.warranted != 'true'
        run: |
          echo "No release-worthy commits since the last tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # A repository with no Python has no requirements file, which is every paper. The pipeline
        # scripts need only the standard library, so the plan is still readable.
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            echo "No requirements-dev.txt; nothing to install."
          fi

      # `release.py` still resolves the release for the notes window and the paper build, so both
      # resolvers read the same tree until the Python is gone. If they ever disagree about the
      # version or the tag the release stops here, rather than tagging one number and attaching
      # assets that were built for another.
      - name: Confirm the TypeScript resolver agrees with the Python pipeline
        if: steps.version.outputs.warranted == 'true'
        run: |
          python "${PIPELINE_SCRIPTS:-.github/scripts}/release.py" \
            --repo-root . \
            --notes-out "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
          ts_version=$(jq -r '.next // ""' "$RUNNER_TEMP/version.json")
          py_version=$(jq -r '.version // ""' "$RUNNER_TEMP/release.json")
          ts_tag=$(jq -r '.tag // ""' "$RUNNER_TEMP/version.json")
          py_tag=$(jq -r '.tag // ""' "$RUNNER_TEMP/release.json")
          if [ "$ts_version" != "$py_version" ] || [ "$ts_tag" != "$py_tag" ]; then
            echo "Version resolvers disagree, so the release cannot be assembled:" >&2
            echo "  scripts/versioning.ts:         version=$ts_version tag=$ts_tag" >&2
            echo "  .github/scripts/versioning.py: version=$py_version tag=$py_tag" >&2
            exit 1
          fi
          echo "Both resolvers agree on $ts_tag."

      - name: Verify package metadata agrees with the release
        if: steps.version.outputs.warranted == 'true'
        run: |
          python - <<'PY'
          import json, os, sys
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))
          problems = data["metadata_problems"]
          if problems:
              print("Package metadata disagrees with the release version:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)
          print("Package metadata is conformant.")
          PY

      - name: Detect the paper domain
        if: steps.version.outputs.warranted == 'true'
        id: paper
        # The paper is built here, where the typesetting engines are installed. A paper's asset is
        # its PDF, which cannot be produced without one.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          sys.path.insert(0, os.environ.get("PIPELINE_SCRIPTS", ".github/scripts"))
          import environment

          env = environment.configure(".")
          print(f"typst={str(env.has('typst')).lower()}")
          print(f"latex={str(env.has('latex')).lower()}")
          PY

      - name: Set up Typst
        if: steps.version.outputs.warranted == 'true' && steps.paper.outputs.typst == 'true'
        uses: typst-community/setup-typst@9107b8dd77d7a7fd6c5faebbb507cac28069042e # v5.3.0b1

      - name: Set up TeX Live
        if: steps.version.outputs.warranted == 'true' && steps.paper.outputs.latex == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Decide which build tooling is needed
        if: steps.version.outputs.warranted == 'true'
        id: tooling
        # Read once into an output rather than testing inline: a suppressed error in a conditional
        # silently takes the "nothing needed" branch, which is how a missing build backend went
        # unnoticed across three repositories.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          steps = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))["steps"]
          commands = " ".join(step.get("command") or "" for step in steps)
          print(f"python={'true' if 'python -m build' in commands else 'false'}")
          PY

      - name: Install the build backend
        # The pipeline provides the tooling its own default commands need. Requiring every consumer
        # to remember `build` in its requirements file is how this failed in three repositories.
        if: steps.tooling.outputs.python == 'true'
        run: python -m pip install --upgrade build

      - name: Build release assets
        if: steps.version.outputs.warranted == 'true'
        run: |
          python - <<'PY' > "$RUNNER_TEMP/steps.sh"
          import json, os, shlex
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))
          for step in data["steps"]:
              if step.get("command"):
                  print(f"( cd {shlex.quote(step['cwd'])} && {step['command']} )")
          PY
          # Only where a document is going to be written; an unconditional mkdir leaves a stray
          # directory that setuptools then discovers as a rival top-level package.
          if [ "${{ steps.paper.outputs.typst }}" = "true" ] \
             || [ "${{ steps.paper.outputs.latex }}" = "true" ]; then
            mkdir -p out
          fi
          if [ -s "$RUNNER_TEMP/steps.sh" ]; then
            echo "Build steps:"; cat "$RUNNER_TEMP/steps.sh"
            bash -euxo pipefail "$RUNNER_TEMP/steps.sh"
          else
            echo "Nothing to build; this release carries no project assets."
          fi

      - name: Collect release assets
        if: steps.version.outputs.warranted == 'true'
        id: assets
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, os.environ.get("PIPELINE_SCRIPTS", ".github/scripts"))
          import release
          data = json.load(open(os.environ["RUNNER_TEMP"] + "/release.json"))
          found = release.collect_assets(".", data["steps"])
          # The list is written twice because the publish job needs it as a file to iterate and
          # this job needs it as a step output to gate on.
          with open(os.environ["RUNNER_TEMP"] + "/assets.txt", "w", encoding="utf-8") as handle:
              for path in found:
                  handle.write(path + "\n")
          print(f"has={'true' if found else 'false'}")
          print("files<<EOF")
          for path in found:
              print(path)
          print("EOF")
          PY

      - name: Stage the collected release assets
        if: steps.version.outputs.warranted == 'true' && steps.assets.outputs.has == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            mkdir -p "$RUNNER_TEMP/release-assets/$(dirname "$asset")"
            cp "$asset" "$RUNNER_TEMP/release-assets/$asset"
          done < "$RUNNER_TEMP/assets.txt"
          find "$RUNNER_TEMP/release-assets" -type f

      - name: Upload the collected release assets
        if: steps.version.outputs.warranted == 'true' && steps.assets.outputs.has == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
          retention-days: 1

      # The release notes are written to the runner's temporary directory, which does not survive
      # into another job, so they travel as their own artifact rather than being regenerated.
      - name: Upload the release notes
        if: steps.version.outputs.warranted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          retention-days: 1

  # One job per published target, each on a runner that is natively that platform and architecture,
  # because the build is verified by running the artifact. A cross-compiled binary cannot be run by
  # the runner that produced it, so a target without a native runner would ship bytes nothing ever
  # executed. The matrix is not written here: it is derived from
  # packages/harness/scripts/release-targets.ts.
  build:
    name: build ${{ matrix.target }}
    needs: resolve
    if: needs.resolve.outputs.warranted == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install package dependencies
        run: bun install --frozen-lockfile

      - name: Build df for ${{ matrix.target }}
        run: bun run --cwd packages/harness build --target=${{ matrix.target }}

      # Compiling for a platform is not the same as working on it: a bundle can build for all five
      # targets and still fail on one because a native module is missing or a worker cannot be
      # found. The binary is run here, on its own platform, before it is allowed to become an asset.
      - name: Run the built binary and record its digest
        run: bun packages/harness/scripts/verify-target.ts --target ${{ matrix.target }}

      - name: Upload the built binary and its digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: df-${{ matrix.target }}
          path: |
            packages/harness/dist/${{ matrix.asset }}
            packages/harness/dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: [resolve, build]
    if: needs.resolve.outputs.warranted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Tags decide whether this release already exists, so the history has to be here.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .darkfactory-pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .darkfactory-pipeline/.github/scripts ]; then
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.darkfactory-pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download the release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: notes

      - name: Download every built df artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: df-*
          path: dist
          merge-multiple: true

      - name: Download the collected release assets
        if: needs.resolve.outputs.has-assets == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      # Every df artifact is re-hashed here against the digest taken in the job that built and ran
      # it. This is the only place the published bytes and the built bytes are compared, so a
      # corrupted upload fails the release instead of being checksummed as if it were correct.
      - name: Re-verify every df artifact and write the release checksums
        run: bun packages/harness/scripts/release-checksums.ts dist

      - name: List the assets to attach
        id: assets
        run: |
          # The per-target `.sha256` files are the records just verified against, not release
          # assets. `checksums.txt` supersedes them, so attaching them would publish two answers
          # to the same question.
          mapfile -t ASSETS < <(find dist -type f ! -name '*.sha256' | sort)
          if [ "${{ needs.resolve.outputs.has-assets }}" = "true" ]; then
            mapfile -t PROJECT < <(find release-assets -type f | sort)
            ASSETS+=("${PROJECT[@]}")
          fi
          if [ "${#ASSETS[@]}" -lt 1 ]; then
            echo "No release assets were produced; refusing to publish an empty release." >&2
            exit 1
          fi
          printf '%s\n' "${ASSETS[@]}" | tee "$RUNNER_TEMP/asset-list.txt"
          echo "Assets: ${#ASSETS[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"

          # Every asset is attached by one `gh release create`, so a reader never sees a release
          # that is missing a platform the matrix claims to publish.
          mapfile -t ASSETS < "$RUNNER_TEMP/asset-list.txt"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes/notes.md \
            "${ASSETS[@]}"

          {
            echo "## Released \`$TAG\`"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/asset-list.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record the released version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python "${PIPELINE_SCRIPTS:-.github/scripts}/release.py" \
            --repo-root . \
            --record-version "$VERSION" \
            --released-tag "$TAG"
