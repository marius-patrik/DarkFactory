name: Format Legacy Retirement (self-removing)
on:
  push:
    branches: [fix/fleet-retire-merged-legacy-install]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fleet-retire-merged-legacy-install
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx biome format --write scripts/fleet-control.mjs scripts/fleet-control.test.mjs
          bunx biome lint --write scripts/fleet-control.mjs scripts/fleet-control.test.mjs || true
      - run: |
          git rm .github/workflows/df-legacy-retire-format.yml
          git add scripts/fleet-control.mjs scripts/fleet-control.test.mjs
          git -c user.name=github-actions\[bot\] -c user.email=41898282+github-actions\[bot\]@users.noreply.github.com commit -m "style(fleet): format merged legacy branch verification"
          git push origin HEAD:fix/fleet-retire-merged-legacy-install
