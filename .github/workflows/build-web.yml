name: Build Verified DarkFactory Operator Web
on:
  push:
    branches: [integration/2703-web-acceptance]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darkfactory-web-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    name: Build immutable Web artifact at exact source SHA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - name: Verify frontend source integrity and tests
        run: |
          bun test ./.github/tests/web/*.test.ts ./.github/tests/web/*.test.tsx
          bun run typecheck
          bun run format:check
          bun run lint
      - name: Build browser artifact with immutable SHA
        env:
          DF_WEB_BASE_PATH: ${{ vars.DF_PAGES_BASE_PATH || '/DarkFactory/' }}
          DF_WEB_REPOSITORY: ${{ github.repository }}
        run: bun packages/web/scripts/build.ts packages/web/dist
      - name: Verify manifest against checked out source
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            const m = await Bun.file("packages/web/dist/darkfactory-web-manifest.json").json();
            if(m.sourceSha!==process.env.GITHUB_SHA || m.kind!=="darkfactory-operator" ||
               m.routeMode!=="hash" || m.assets.length<3) process.exit(1);
            for(const a of m.assets){
              const buf=await Bun.file("packages/web/dist/"+a.path).arrayBuffer();
              const hex=Buffer.from(await crypto.subtle.digest("SHA-256",buf)).toString("hex");
              if(hex!==a.sha256) process.exit(1);
            }'
      - name: Retain trusted Web candidate for separately authorized packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: darkfactory-web-candidate
          path: packages/web/dist
          if-no-files-found: error
          retention-days: 7
