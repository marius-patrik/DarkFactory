# df-control-managed: 1
name: DarkFactory Control
on:
  workflow_call:
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  repository-projects: write
jobs:
  quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: released-df-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install SHA256-verified released df
        env:
          DF_TAG: "v0.288.1"
          DF_SHA256: "8b4861ba4efcba1cf3378a2ff92a7fbb2d9887cabca6d494c9a58c7f95514ffd"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 "https://github.com/marius-patrik/DarkFactory/releases/download/$DF_TAG/df-linux-x64.tar.gz" --output "$RUNNER_TEMP/df.tar.gz"
          echo "$DF_SHA256  $RUNNER_TEMP/df.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/darkfactory"
          tar -xzf "$RUNNER_TEMP/df.tar.gz" -C "$RUNNER_TEMP/darkfactory"
      - name: Run actual repository quality actions
        run: "$RUNNER_TEMP/darkfactory/df-linux-x64" ci quality --repo "$GITHUB_WORKSPACE"
  agent:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'
    uses: marius-patrik/DarkFactory/.github/workflows/agent.yml@13a9feb64555a8fb2f3ad9cf7e687b7fd1115838
    with:
      pipeline-ref: "13a9feb64555a8fb2f3ad9cf7e687b7fd1115838"
      pipeline-repo: marius-patrik/DarkFactory
      agent-enabled: ${{ vars.AGENT_ENABLED }}
    secrets: inherit
  issue-binding:
    if: github.event_name == 'pull_request'
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@13a9feb64555a8fb2f3ad9cf7e687b7fd1115838
    with:
      pipeline-ref: "13a9feb64555a8fb2f3ad9cf7e687b7fd1115838"
      pipeline-repo: marius-patrik/DarkFactory
    secrets: inherit
  approvals:
    if: github.event_name == 'pull_request_review' || github.event_name == 'issue_comment'
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@13a9feb64555a8fb2f3ad9cf7e687b7fd1115838
    with:
      pipeline-ref: "13a9feb64555a8fb2f3ad9cf7e687b7fd1115838"
      pipeline-repo: marius-patrik/DarkFactory
    secrets: inherit
