name: Auto Format

on:
  push:
    branches: ["**"]
  workflow_dispatch:

  # Consumers call this rather than copying it, so the scripts it runs live in one place.
  workflow_call:
    inputs:
      pipeline-ref:
        description: "Commit SHA of the pipeline repository to run. Empty means this repository."
        required: false
        type: string
        default: ""
      pipeline-repo:
        description: "Repository holding the shared scripts."
        required: false
        type: string
        default: "marius-patrik/DarkFactory"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check out the pinned pipeline
        if: inputs.pipeline-ref != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline-repo }}
          ref: ${{ inputs.pipeline-ref }}
          path: .pipeline

      - name: Put the pipeline scripts on the path
        run: |
          if [ -d .pipeline/.github/scripts ]; then
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.pipeline/.github/scripts" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
            echo "PIPELINE_SCRIPTS=$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install "black>=24.0.0"

      - name: Format Python
        # Only where there is Python to format; a paper repository has none.
        if: hashFiles('**/*.py') != ''
        run: black .

      - name: Format Rust
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all

      - name: Format web sources
        if: hashFiles('package.json') != ''
        run: npm run --if-present format

      - name: Commit and push formatting changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes needed. Codebase is clean."
            exit 0
          fi
          echo "Formatting changes detected. Committing via the Actions bot..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ci): auto-format codebase via GitHub Actions bot [skip ci]"
          if [ "${{ github.ref_name }}" != "darkfactory" ]; then
            git push origin "${{ github.ref_name }}"
          else
            echo "Branch is main; direct push skipped to comply with branch protection."
          fi
