name: Auto Format

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install "black>=24.0.0"

      - name: Format Python
        run: black .

      - name: Format Rust
        if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all

      - name: Format web sources
        if: hashFiles('package.json') != ''
        run: npm run --if-present format

      - name: Commit and push formatting changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No formatting changes needed. Codebase is clean."
            exit 0
          fi
          echo "Formatting changes detected. Committing via the Actions bot..."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ci): auto-format codebase via GitHub Actions bot [skip ci]"
          if [ "${{ github.ref_name }}" != "main" ]; then
            git push origin "${{ github.ref_name }}"
          else
            echo "Branch is main; direct push skipped to comply with branch protection."
          fi
