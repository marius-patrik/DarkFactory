name: "Epic"
description: "An optional container for genuinely independent Requests that benefit from shared scope and relationships."
title: "Epic: "
labels: ["epic", "Backlog"]
body:
  - type: markdown
    attributes:
      value: |
        Use an Epic only when genuinely independent Requests benefit from separate lifecycle,
        ownership, sequencing or delivery while sharing one larger scope. Epics organize
        relationships; they are not mandatory wrappers around large work and never waive each child
        Request's own Planning, evidence, and completion gates.

  - type: textarea
    id: scope
    attributes:
      label: "Scope"
      description: "What this epic covers, and - just as importantly - what it does not."
    validations:
      required: true

  - type: textarea
    id: gate
    attributes:
      label: "Entry Gate"
      description: >
        What must be true before this epic or its children may leave `Backlog`: required product
        behavior is settled in PRD/accepted ADRs and any explicit dependencies are resolved.
      placeholder: "Blocked by the accepted runtime ADR and Request #123."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "How we know the whole epic is done, not just any single child."
      placeholder: |
        - [ ] Adding a new brand preset requires zero code changes
        - [ ] Performance budget from D7 is met and measured in CI
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: "Child Requests"
      description: "Optional checklist of genuinely independent child Requests. Leave empty when one coherent Request is the better delivery unit."
      placeholder: |
        - [ ] #0 Request: ...
    validations:
      required: false
