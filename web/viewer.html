<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2b2d31">
  <title>DarkFactory-Paper viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="viewer">
    <header class="toolbar">
      <div class="toolbar-left">
        <a class="icon-btn" href="./" title="Back to variants" aria-label="Back to variants">←</a>
        <button class="icon-btn" id="sidebar-toggle" type="button" title="Toggle thumbnails" aria-label="Toggle thumbnails">☰</button>
        <span class="doc-title">DarkFactory-Paper</span>
        <span class="mobile-title">Final</span>
      </div>

      <div class="toolbar-center">
        <button class="icon-btn" id="prev-page" type="button" title="Previous page" aria-label="Previous page">‹</button>
        <label class="page-control">
          <input id="page-input" type="number" min="1" value="1" aria-label="Page number">
          <span id="page-total">/ –</span>
        </label>
        <button class="icon-btn" id="next-page" type="button" title="Next page" aria-label="Next page">›</button>
        <span class="separator"></span>
        <button class="icon-btn" id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <span class="zoom-control" id="zoom-value">Fit</span>
        <button class="icon-btn" id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="text-btn" id="fit-width" type="button" title="Fit width">Fit</button>
      </div>

      <div class="toolbar-right">
        <a class="text-btn primary" id="peer-link" href="#">Review</a>\n        <a class="text-btn" id="split-link" href="#">Split</a>
        <a class="text-btn desktop-only" id="download-link" href="#" download>Download</a>
        <a class="text-btn desktop-only" id="native-link" href="#" target="_blank" rel="noopener">PDF</a>
        <span class="separator desktop-only"></span>
        <button class="icon-btn desktop-only" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">☀</button>
        <button class="icon-btn desktop-only" id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
    </header>

    <main class="content">
      <aside class="sidebar" aria-label="Page thumbnails"></aside>
      <section class="stage" aria-label="Document">
        <div class="pages"></div>
        <div class="loading">Loading document…</div>
      </section>
    </main>
  </div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
